  # 1. Q2 and Q7 are back to 2.1.0's exact option text. covers is empty on purpose: nothing about these options is approved to differ from 2.1.0;
  #    the two pins above the decisions list fail the run if either string changes again.
  - covers: []
    status: approved
    by: Daniel
    date: 2026-10-17
    source: "Daniel, Oct 17 2026, decision 1: revert calibration.questions.Q2.options and Q7.options to 2.1's exact text; 'the old wording was better and parameterized; rewording invites drift'. The tension with the plain-words rule is known: the double hyphen and the British spelling stay; pcp.yaml plain_words.exempt holds exactly the Q7 string."
    summary: "Q2's PE option reads 'GPs, LPs, portfolio companies; adds fund/portfolio news families.' and Q7's EU option reads 'Adds minimisation -- claims.jsonl deleted after render.', byte for byte as in 2.1.0 (parity: unchanged)."
