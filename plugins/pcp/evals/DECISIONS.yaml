    status: approved
    by: Daniel
    date: 2026-10-16
    source: "D3 (corrected Oct 16: 10 pt, not 9.5) for everything a reader reads (page_budget.text_sizes_pt)"
    summary: "C10 adds exactly 3 pages with the ledger last on page 2 and the script on page 3."
