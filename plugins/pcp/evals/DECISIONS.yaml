# DECISIONS.yaml -- the only way a rule, parameter, source family, grade field, layout size, setup question, eval check or schema section of the
# original talyx-ai plug-in (2.1.0, frozen in evals/baseline-2.1.0.json) may differ from it.
#
# `python3 eval.py parity` fails on any baseline item that is changed or removed unless an entry here with `status: approved` covers it
# (`covers` is a list of fnmatch patterns on the item id; run `eval.py parity --list` for the ids). `status: open` is listed, and fails
# under `parity --strict`: it records a change nobody has approved yet. A schema section (forms, grading, records, ...) whose hash differs
# from evals/schema.lock.json fails unless an approved entry covers `lock:<section>@<new hash>`.
#
# An entry names who decided and where it is recorded. A session may add an `open` entry; only Daniel's word (or the cited meeting or
# instruction) makes one `approved`. Never edit baseline-2.1.0.json to make parity pass.
version: 1
# Pins: values fixed by Daniel. `parity` fails on any run where one differs, whatever else is approved here.
pins:
  - path: page_budget.text_floor_pt
    equals: 10.0
    why: "Daniel, Oct 16: body text is 10 pt, not 9.5; Ben, Oct 13 (commit 2ff8d0a): 10 pt body on every rung"
  - path: page_budget.body_pt_floor
    equals: 10.0
    why: "2.1.0 declared 10 pt (page_budget.body_pt_floor); Ben, Oct 13"
  - path: page_budget.text_sizes_pt
    min: 10
    except: [footer, band]
    why: "everything a reader reads is at 10 pt or more; only the footer (7.5 pt, as in 2.1) and the classification band stay small"
  - path: page_budget.brief_ladder
    each_min: {key: body_pt, min: 10}
    why: "Ben, Oct 13: 10 pt body on every rung of the brief style"
  - path: page_budget.ladder
    each_min: {key: body_pt, min: 10}
    why: "2.1.0's ladder bottoms at 10 pt"

  - path: calibration.questions.1.options.2.description
    equals: "GPs, LPs, portfolio companies; adds fund/portfolio news families."
    why: "Daniel, Oct 17, decision 1: Q2's private-equity option is 2.1.0's text, byte for byte"
  - path: calibration.questions.6.options.1.description
    equals: "Adds minimisation -- claims.jsonl deleted after render."
    why: "Daniel, Oct 17, decision 1: Q7's EU option is 2.1.0's text, byte for byte"
  - path: grading.source_link
    equals: domain
    why: "Daniel, Oct 17, decision 3: a ledger source prints as its domain, a link to the full address"

decisions:
