  - covers: ["brief.sections.B*", "script.blocks.P*", "script.title", "checks.C1.*", "checks.C2.*", "checks.C3.*", "checks.C4.*", "checks.C5.*", "checks.C7.*", "checks.C8.*", "checks.C10.*", "eval.definition"]
    status: approved
    by: Daniel and Ben
    date: 2026-10-13
    source: "Ben's schema, approved Oct 13 (pcp.yaml brief comment; AID-7); Daniel, Oct 16 (D3): 'keep Ben's schema but cut density back'; block mapping in PARITY-B Table C1 rows C-087 to C-111, C-117 to C-129"
    summary: "Blocks B1-B9 and P1-P7 became B1-B10 and P1-P9; the checks follow the new ids; the word budgets are the D3 density cut (page_budget.density keeps the old ones for briefs dated before Oct 16)."
  # ---- plain words (Oct 9): the user reads no intelligence-trade or technical words
  - covers: ["calibration.questions.Q5.options", "stages.S3.name", "stages.S3.rows.S3-1.*", "stages.S3.rows.S3-4.*", "stages.S2.name", "families.F12.extract"]
    status: approved
    by: Daniel
    date: 2026-10-13
    source: "plain_words in pcp.yaml: Oct 9 'don't use mil/intel/tech words in actual outputs'; Daniel Oct 13: intel words fine internally, banned only in rendered output; D1, Oct 16: 'SOCMINT/military terms stay internal; user-facing reads plain'"
    summary: "families -> source types; ACH -> what they may want; score -> read; Behavioral read -> Behavioral profile; stage names are placeholders."
  # ---- D1 / D2: LinkedIn and the social chip
  - covers: ["calibration.questions.Q6.header", "calibration.questions.Q6.options", "families.F6.extract", "stages.S2.rows.S2-1.*"]
    status: approved
    by: Daniel
    date: 2026-10-16
    source: "D1 (Q6 chip reads 'Social'); D2 (read a LinkedIn URL or a saved profile when the user gives one); AID-63 Oct 14 (search results, never a browser)"
    summary: "Q6 chip 'Social'; LinkedIn read as search results, a link the user gives, or a saved profile; S2-1 states it; F6's extract names S2-7."
  # ---- the user's own files and answers are a source (CAL-4, Oct 9)
  - covers: ["calibration.questions.Q8.*", "families.F11.extract", "stages.S2.inputs"]
    status: approved
    by: Ben and Daniel
    date: 2026-10-09
    source: "pcp.yaml CAL-4 basis: 'Oct 9: a user with a business context profile can upload files'; Sep 28: use what people already have"
    summary: "Q8 invites file paths; F11 and known_context widen to the user's notes, files and answers (tag Yours)."
  # ---- source grading: Daniel delegated the design (Oct 16) and the claim fields grew
  - covers: ["stages.S2.outputs", "stages.S2.rows.S2-2.*", "stages.S2.rows.S2-3.*", "stages.S2.rows.S2-5.*"]
    status: approved
    by: Daniel
    date: 2026-10-16
    source: "Ben's grades, Oct 7 (Measured, Derived, Inference, Not determined); Daniel Oct 16: 'figure out the best evidence-grading design ... hard requirement: weak sources never read as strong' -> grading in pcp.yaml; MUST-FIX 9 (base + rounds in coverage); status stamped in the masthead (Oct 14)"
    summary: "Claims keep every 2.1.0 field and add published, grade, says, page; coverage keeps every 2.1.0 field and adds base, rounds, linkedin, searches, per-type counts; the page prints grade, how found and strength."
  # ---- masthead / footer / run row (Oct 7, Oct 14)
