    status: approved
    by: Daniel
    date: 2026-10-17
    source: "Daniel, Oct 17 2026, C9-DECISION.md: word-start matching (every 2.1 inflection trips) plus an explicit compound list so sensitive compounds a word-start match would miss still trip"
    summary: "C9 reads pcp.yaml exclusions.keywords (2.1.0's keywords, from the start of a word) and exclusions.compounds (22 real words, exact whole-word match: misdiagnosed, grandchildren, countersued, coplaintiff ...). Still looser than 2.1.0 only for a keyword inside an unrelated word (issued, effect) and a compound not in the list; eval.py gates reports it."
