    source: "Daniel Oct 14: no page footer holds a metric; run details under the sources (Oct 7); output file name '<date>-<slug>-intelligence-brief.pdf'"
    summary: "Profile line, status and metrics moved from the footer to the masthead meta line and the ledger's Run row; ledger numbers replace claim ids."
  # ---- evidence tier (Ben's profile schema) and the overflow rule
