# ------------------------------------------------------------------------------------------------
# 4. PAGE BUDGET -- ONE 3-page PDF: the brief on pages 1-2, the script on page 3. The renderer owns the
#    type sizes (format/talyx_pdf.py --style brief) and FAILS if its tightest rung still overflows.
# ------------------------------------------------------------------------------------------------
page_budget:
  total_pages: 3
  brief_pages: 2
  script_pages: 1
  # the type scale lives here and format/talyx_pdf.py reads it from pcp.json (a copy with no pcp.json beside it keeps the same
  # numbers as defaults; eval.py self-test fails if they differ). Brief body type is 10 pt on every rung (Oct 13: "Keep 10 pt, not 9 pt").
  body_pt_floor: 10.0
  ladder:        # --style house
    - {name: loose,   body_pt: 11.0, line_height: 1.42, para_gap_pt: 6, sec_gap_pt: 12, mh: [0.15, 0.22], cell: 3,   page: [0.55, 0.6]}
    - {name: normal,  body_pt: 10.5, line_height: 1.36, para_gap_pt: 5, sec_gap_pt: 10, mh: [0.15, 0.22], cell: 3,   page: [0.55, 0.6]}
    - {name: tight,   body_pt: 10.0, line_height: 1.30, para_gap_pt: 4, sec_gap_pt: 8,  mh: [0.15, 0.22], cell: 3,   page: [0.55, 0.6]}
    - {name: compact, body_pt: 10.0, line_height: 1.24, para_gap_pt: 3, sec_gap_pt: 6,  mh: [0.05, 0.14], cell: 1.5, page: [0.45, 0.55]}
  brief_ladder:  # --style brief
    - {name: normal,  body_pt: 10.0, line_height: 1.30, para_gap_pt: 3, sec_gap_pt: 10, cell: 2.4}
    - {name: tight,   body_pt: 10.0, line_height: 1.24, para_gap_pt: 2, sec_gap_pt: 8,  cell: 1.8}
    - {name: compact, body_pt: 10.0, line_height: 1.18, para_gap_pt: 2, sec_gap_pt: 6,  cell: 1.2}
  text_sizes_pt: {footer: 7.5, band: 7.8, name: 20, preline: 9.5, meta: 9.5, sec_head: 9.5, sub: 9.5, decides: 9.5, th: 9.5, ledger_note: 9.5, ledger: 9.5, grade: 9.5}   # D3 (Daniel, Oct 16): 9.5 pt and up for everything a reader reads; only the footer and the classification band stay small
  text_floor_pt: 9.5
  text_floor_exempt: [footer, band]
  density: {since: 2026-10-16, legacy_words: {B1: 60, B10: 550, B2: 210, B3: 110, B4: 90, B5: 100, B6: 170, B7: 50, B8: 120, B9: 120,   P1: 80, P2: 120, P3: 110, P4: 80, P5: 60, P6: 80, P7: 60, P8: 50, P9: 25}}   # D3: the word budgets below fit the page at 9.5 pt and up; a brief prepared before this day keeps the old budgets (the frozen targets)
  columns: "B3|B4,B5|B6,B7|B8,P1+P2+P3+P4|P5+P6+P7+P8"   # side-by-side blocks, as in the approved schema (Oct 8)
brief:
  # The approved schema (proposed Oct 8; AID-7 still In Review, not locked): nine blocks and the evidence ledger. Ben's format.
  # Before B2: `# Full Name`, then the identity line, then the meta line (S4-5).
  sections:
    - {id: B1, title: Take, words: 45, prints: always, content: "One paragraph: **Take.** who they are and why this meeting matters to them now, in one sentence, every clause cited. **Evidence:** the one to three facts it rests on [n]. **Action:** the first move in the room, on the fact behind it [n]. **Avoid:** the one move that loses the meeting, on the fact that shows why [n] -- never a generic line. It adds no fact the blocks below don't cite."}
    - {id: B2, title: Questions that close gaps, words: 130, prints: always, content: "4 to 6 numbered questions, each <= 40 words, on the fact it rests on [n]; under each, one indented bullet: **Decides:** what the answer tells you. **Ask:** whom -- the person, or who else is in the room. Ordered by what they decide; the mix follows the meeting type (Q4)."}
    - {id: B3, title: Who they are, words: 80, prints: always, content: "Bullets, label first: **Role:** title and since when [n] (required). **Path:** the prior roles that matter, with education and credentials [n]. **The organization:** in its own words, plus one scale figure [n]. **What changed:** one to three dated items, newest first [n]. **Recent wins:** none to two dated, cited results [n]. Path, The organization and What changed read Not determined if not found; Recent wins is left out. From F1 F2 F3 F4 F9."}
    - {id: B4, title: In their words, words: 60, prints: always, content: "2-3 bullets, label first: **Topic, where, when:** \"their exact words\" [n]. None found: one line of themes from their public presence [n]; nothing at all: Not determined. Then always one last line, not a bullet: **LinkedIn:** read from search results, **LinkedIn:** read from your file, or **LinkedIn:** not read: and the reason (S2-7). From F5 F6 F8 and LinkedIn."}
    - {id: B5, title: Signals and what to do with them, words: 65, prints: always, content: "A table: | Observable | What to do with it |, three rows in this order: their priority and the gap, in their words [n] -> why this meeting matters to them; where your offer connects (Q8) [n] -> the bridge: the outcome you offer, not the method; the trigger, why now [n] -> the urgency, never invented. From F3 F10 F11 and Q8."}
    - {id: B6, title: "{profile}", words: 110, prints: always, content: "A table: | What the record shows | Your move |, six rows, one per rubric dimension, each starting with its label (Pace and control, How they take recognition, Appetite for detail, Appetite for risk, How they take disagreement, How they keep score) and a colon: the cited observation in at most 8 words [n] -> the rubric's move word for word. A dimension with no evidence is the bare label and No read (| Pace and control | No read |), never \"none found\". Then one line: **Evidence tier:** high, medium or low (it governs page 3). A cited observation and a move, never a verdict on their character."}
    - {id: B7, title: Who decides, words: 25, prints: always, content: "Bullets: **Decision maker:** who signs off [n]. **The gate:** what must be true, or who must agree, before a yes [n]. **Relationship holder:** who the relationship runs through [n]. Unknown: Not determined (a gap Still open may ask). From F1 F3 F9 F11."}
    - {id: B8, title: Strongest case against, words: 70, prints: always, content: "Up to 3 bullets: **Against:** the best evidence against your read [n]. **Reverses if:** what would flip it. **Confirm first:** each fact the brief leans on that is graded Inference or Not determined (outside the behavioral profile), marked [UNVERIFIED], with the question that settles it [n]; none: leave the bullet out. None found against: No counter-evidence found. Deep runs only, then `### What they may want from this meeting` and a table | Hypothesis and why it fits | Test: who answers, and what would disprove it |, up to 3 rows, each with the claim that would disprove it [n]. From F12; litigation stays off the page."}
    - {id: B9, title: Meeting angle, words: 70, prints: always, content: "One label per bullet (only The ask and its Fallback share one). `### This meeting` then bullets: **Frame:** what this meeting is, in their terms; not a pitch. **Lands:** [n]. **Repels:** [n]. **What to bring:** one thing of value [n]. **The ask:** specific and bounded, who and how long [n] · **Fallback:** the smaller ask. **Stop if:** the answer that means drop the ask. `### Meeting two` then **Meeting two:** the next conversation if this one lands, on a fact from this brief. **Meeting three:** where it goes after that. `### After the meeting` then **Capture:** what to record from the room that the public record couldn't give. From Q8 and B3-B8."}
    - {id: B10, title: Evidence ledger, words: 330, prints: always, content: "One line: {n} facts cited; status {FULL or LIMITED} at {n} of 12 source types; the strength key. A weak source never reads Strong or Solid. Dates are the sources' own; 'seen' marks the day an undated source was read. Then the table | # | What it says | Source | Grade | Date |, exactly one row per cited fact in order of first use (never grouped): [n] · the fact in about 8 words · [domain](url), then ' · ' and how it was found: Direct, Search, LinkedIn or Yours (a file name for your own files is Yours) · the grade Measured, Derived, Inference or Not determined, then ' · ' and the source's strength as one plain word from grading.words (Strong, Solid, Weak, Inferred; the ledger's note line keys them: 'Strong: primary, dated' ...) · the source's own date, Mon D, YYYY, or Mon YYYY when the source gives only a month (claims.jsonl published); only for an undated source, the day it was read, marked 'seen Mon D, YYYY'. The tag and the strength print on the page (C25) and stay in claims.jsonl as tag and confidence (C1-C4); the codes themselves never print. Then a label grid (empty header row) with four rows: **Coverage** -- n of 12 source types in the base pass, the rounds run (M of N), what was not found and why, and LinkedIn: read from search results, LinkedIn: read from your file, or LinkedIn: not read: and B4's reason. **Still open** -- at most 4 gaps, highest value first, each with the question that closes it in the room ('Label: question?', joined by ' · '). **Left out on purpose** -- the excluded topics, never the facts. **Run** -- date · depth · meeting type · prepared for (role) · domain · jurisdiction · status · decision-useful facts per page · N searches (B base) in M rounds (both passes as sent, S2-9)."}
  vocab_by_domain:
    general: []
    wealth:  [book, AUM, custodian, fee compression, succession, next-gen]
    pe:      [dry powder, DPI, add-on, hold period, exit]
    saas:    [ARR, NRR, champion, security review, procurement, renewal]
script:
  title: "{script}"
  subtitle: "Facts choose the moves; read the room, not the record"
  subtitle_retired: {"Facts select the moves; read the room, never the record": 2026-10-15}   # a script prepared before this day keeps its subtitle (the frozen targets)
  beats_by_format:
    intro:        [open, credibility in one line, one insight they did not have, ask for the second meeting]
    discovery:    [open, situation question, gap question, impact question, next-step test]
    close:        [open, restate their words, the outcome, the safeguard, the ask]
    relationship: [open, acknowledge what changed, one thing of value, one forward question]
  blocks:
    - {id: P1, title: Open, words: 70, prints: always, content: "Bullets: **Hook:** two sentences, said aloud, on a cited fact [n] -- in italics. **Credibility:** who you are, in one line, 30 seconds [n]. **Insight:** one thing they didn't have [n]. **Rule:** how to hold the opening's rapport through the questions."}
    - {id: P2, title: Question order, words: 130, prints: always, content: "Bullets: **Beats:** one line per beat of the meeting type (script.beats_by_format for Q4), each on the [n] it rests on. Then **Story:** **Process:** **Gate:** **History:** **Commitment:** -- B2's questions word for word, in the order the room needs."}
    - {id: P3, title: "Objections: name it, then answer", words: 90, prints: always, content: "3 bullets: **Their likely objection:** *say it before they do, then the answer, at most 30 words* [n]."}
    - {id: P4, title: Close, words: 70, prints: always, content: "Bullets: **Restate:** ask what would make it an easy yes, then say it back in their words. **Real deadline:** a date that actually moves [n]. **The ask:** B9's ask · **Fallback:** B9's fallback. **Follow-up:** what you promise to send, and when."}
    - {id: P5, title: "Read the room (watch, do not assume)", words: 50, prints: "evidence tier medium or high", content: "Bullets: **Fast, wants the answer:** **Asks for terms and data:** **Talks about people:** **Big picture, ideas:** -- what you do, from B6."}
    - {id: P6, title: "Influence, one fact behind each", words: 70, prints: "evidence tier high and caller authority high; each principle only where a cited fact backs it", content: "Bullets, only for principles a cited fact backs: **Authority:** **Reciprocity:** **Commitment:** **Social proof:** **Liking:** **Scarcity:** (real limits only; never invented urgency) [n]."}
    - {id: P7, title: If it stalls, words: 50, prints: always, content: "2-3 bullets: **The move:** what restarts the conversation, from a fact in this brief [n]."}
    - {id: P8, title: Guardrails, words: 45, prints: always, content: "Bullets: **Rule:** what never to promise or claim, for the jurisdiction (Q7). **Never say:** the guardrails.never_say phrases and the domain's forbidden claims, quoted."}
    - {id: P9, title: Next step, words: 25, prints: always, content: "One line: **Next step:** the one action and its date."}
# ------------------------------------------------------------------------------------------------
# FORMS -- the exact shape of every block. The model never writes brief.md or script.md: it fills fields.json (one entry per
# field below, text citing claims as [c<id>]), and `eval.py assemble` builds both files from this table, the records and the
# profile -- the same structure every run. `eval.py checks --schema` (C26) fails any brief or script that deviates; eval.py
# parity covers this table. A field with `missing` prints that text when empty; `optional` leaves the line out; `cite: yes`
# means the text must cite a claim. Labels are printed exactly as written here.
# ------------------------------------------------------------------------------------------------
forms:
  masthead:
    identity: "**{org}** | {role_since}{city}"                  # city: ' | <city>' only when a source confirms it
    meta: "Meeting: {meeting} | Prepared for: {role} | Depth: {depth} | Sources: {attempted} of {total} source types, {cited} cited | Status {status} | Prepared {date}"
  B1: {form: labels_para, fields: [{key: take, label: "Take.", cite: yes}, {key: evidence, label: "Evidence:", cite: yes}, {key: action, label: "Action:", cite: yes}, {key: avoid, label: "Avoid:", cite: yes}]}
  B2: {form: questions, count: [4, 6], item: [{key: q, cite: yes}, {key: decides, label: "Decides:"}, {key: ask, label: "Ask:"}]}
  B3: {form: bullets, fields: [{key: role, label: "Role:", cite: yes, missing: Not determined}, {key: path, label: "Path:", cite: yes, missing: Not determined}, {key: organization, label: "The organization:", cite: yes, missing: Not determined}, {key: changed, label: "What changed:", cite: yes, list: "; ", missing: Not determined}, {key: wins, label: "Recent wins:", cite: yes, list: "; ", optional: true}]}
  B4: {form: quotes, item: [{key: label}, {key: quote, cite: yes}], themes_key: themes, none: Not determined, linkedin: "**LinkedIn:** {status}"}
  B5: {form: table, header: [Observable, What to do with it], rows: [{key: priority, cite: yes}, {key: offer, cite: yes}, {key: trigger, cite: yes}]}
  B6: {form: profile_table, header: [What the record shows, Your move], none: No read, tier: "**Evidence tier:** {tier}: it sets how far page 3 goes"}
  B7: {form: bullets, fields: [{key: decision_maker, label: "Decision maker:", cite: yes, missing: Not determined}, {key: gate, label: "The gate:", cite: yes, missing: Not determined}, {key: relationship_holder, label: "Relationship holder:", cite: yes, missing: Not determined}]}
  B8: {form: case_against, max: 3, item: [{key: against, label: "Against:", cite: yes}, {key: reverses_if, label: "Reverses if:"}], confirm: {key: confirm_first, label: "Confirm first:", marker: "[UNVERIFIED]"}, none: No counter-evidence found, hypotheses: {head: What they may want from this meeting, header: [Hypothesis and why it fits, "Test: who answers, and what would disprove it"], max: 3}}
  B9: {form: angle, sections: [{head: This meeting, fields: [{key: frame, label: "Frame:"}, {key: lands, label: "Lands:", cite: yes}, {key: repels, label: "Repels:", cite: yes}, {key: bring, label: "What to bring:", cite: yes}, {key: ask, label: "The ask:", cite: yes, join: {key: fallback, label: "Fallback:", sep: " · "}}, {key: stop_if, label: "Stop if:"}]}, {head: Meeting two, fields: [{key: meeting_two, label: "Meeting two:", cite: yes}, {key: meeting_three, label: "Meeting three:"}]}, {head: After the meeting, fields: [{key: capture, label: "Capture:"}]}]}
  B10: {form: ledger, header: ["#", What it says, Source, Grade, Date], note: "{cited} facts cited; status {status} at {attempted} of {total} source types. Strength: {key}. Dates are the sources' own; 'seen' marks the day an undated source was read.", grid: [Coverage, Still open, Left out on purpose, Run], still_open_max: 4}
  P1: {form: bullets, fields: [{key: hook, label: "Hook:", cite: yes, italic: yes}, {key: credibility, label: "Credibility:", cite: yes}, {key: insight, label: "Insight:", cite: yes}, {key: rule, label: "Rule:"}]}
  P2: {form: question_order, beats: {key: beats, label: "Beats:", cite: yes}, order: [Story, Process, Gate, History, Commitment]}
  P3: {form: objections, count: 3, item: [{key: objection}, {key: answer, cite: yes, italic: yes}]}
  P4: {form: bullets, fields: [{key: restate, label: "Restate:"}, {key: deadline, label: "Real deadline:", cite: yes}, {key: ask, label: "The ask:", auto: "B9.ask", join: {key: fallback, label: "Fallback:", sep: " · ", auto: "B9.fallback"}}, {key: followup, label: "Follow-up:"}]}
  P5: {form: bullets, fields: [{key: fast, label: "Fast, wants the answer:", cite: yes}, {key: data, label: "Asks for terms and data:", cite: yes}, {key: people, label: "Talks about people:"}, {key: ideas, label: "Big picture, ideas:", cite: yes}]}
  P6: {form: bullets, fields: [{key: authority, label: "Authority:", cite: yes, optional: true}, {key: reciprocity, label: "Reciprocity:", cite: yes, optional: true}, {key: commitment, label: "Commitment:", cite: yes, optional: true}, {key: social_proof, label: "Social proof:", cite: yes, optional: true}, {key: liking, label: "Liking:", cite: yes, optional: true}, {key: scarcity, label: "Scarcity:", cite: yes, optional: true}]}
  P7: {form: repeat, label: "The move:", cite: yes, key: moves, count: [2, 3]}
  P8: {form: guardrails, rule: {key: rule, label: "Rule:"}, never: {label: "Never say:", sep: " · "}}
  P9: {form: line, key: next_step, label: "Next step:", cite: yes}

# ------------------------------------------------------------------------------------------------
# INVENTORY -- rendered to INVENTORY.md. Oct 9: "inventory of parts/components; what it produces ... if we can't
# produce it, parameterize it so it's conditional". Every part the user sees has one status: always, conditional
# (its Prints when, and the check that enforces it) or removed. No part is unknown. Blocks take their status from
# their own `prints:` above; `check:` names the check that enforces a conditional one.
# ------------------------------------------------------------------------------------------------
inventory:
  blocks:
    - {id: B1, produces: "the one-paragraph read: Take, Evidence, Action, Avoid", sources: [B2-B9]}
    - {id: B2, produces: "five questions, each on a cited fact, with what the answer decides and whom to ask", sources: [F1, F3, F5, F11, Q4]}
    - {id: B3, produces: "role, path, the organization, what changed and recent wins", sources: [F1, F2, F3, F4, F9]}
    - {id: B4, produces: "their own words, quoted and cited, and the LinkedIn status line", sources: [F5, F6, F8, LinkedIn]}
    - {id: B5, produces: "three signals -- their priority, where your offer connects, why now -- and what to do with each", sources: [F3, F10, F11, Q8]}
    - {id: B6, produces: "six observations and the move each one implies, and the evidence tier", sources: [F1, F5, F6, F7]}
    - {id: B7, produces: "decision maker, the gate and the relationship holder", sources: [F1, F3, F9, F11]}
    - {id: B8, produces: "the best evidence against the read and what would reverse it", sources: [F12]}
    - {id: B9, produces: "the frame, what lands and repels, what to bring, the ask and fallback, meetings two and three, what to capture", sources: [Q8, B3-B8]}
    - {id: B10, produces: "every cited fact with what it says, source, grade and date; then Coverage, Still open, Left out on purpose and Run", sources: [F1-F12, Q8]}
    - {id: P1, produces: "the hook said aloud, credibility, one insight, the rapport rule", sources: [B3, B4, Q8]}
    - {id: P2, produces: "B2's questions in the order the room needs", sources: [B2, Q4]}
    - {id: P3, produces: "the likely objections, named first, each with a short answer", sources: [B5, B8]}
    - {id: P4, produces: "restate, a real deadline, the ask and fallback, the follow-up", sources: [B9]}
    - {id: P5, produces: "what to do for each way they show up in the room", sources: [B6], check: C13}
    - {id: P6, produces: "influence principles, only where a cited fact backs one", sources: [B6, Q1], check: C13}
    - {id: P7, produces: "what restarts a stalled conversation, from a fact in the brief", sources: [B3-B9]}
    - {id: P8, produces: "what never to promise or say, for the jurisdiction and domain", sources: [Q2, Q7]}
    - {id: P9, produces: "the one next step and its date", sources: [B9]}
  parts:
    - {id: band, part: Classification band, produces: "the line above the name", sources: [names.classification], status: always}
    - {id: name, part: Name, produces: "the person's full name", sources: [S1], status: always}
    - {id: identity, part: Identity line, produces: "organization, role and since when, city if public", sources: [F1], status: always}
    - {id: meta, part: Meta line, produces: "meeting, prepared for, depth, sources, status, date", sources: [profile, S2], status: always}
    - {id: footer, part: Footer, produces: "the deliverable's name, the person, page N of 3", sources: [renderer], status: always, check: C10}
    - {id: B3.recent_wins, part: Recent wins line (B3), produces: "none to two dated, cited results", sources: [F3, F5], status: conditional, prints: "a dated, cited result was found; otherwise the line is left out", check: C13}
    - {id: B3.not_found, part: "Path, The organization, What changed (B3)", produces: "the fact, or Not determined (a gap Still open may ask)", sources: [F1, F2, F3, F4], status: always, check: C12}
    - {id: B4.linkedin, part: LinkedIn line (B4), produces: "read from search results, read from your file, or not read and the reason", sources: [S2-7], status: always, check: C16}
    - {id: B6.no_read, part: No read rows (B6), produces: "No read where a dimension lacks evidence (a gap Still open may ask)", sources: [S3-1], status: always, check: C12}
    - {id: B7.relationship_holder, part: Relationship holder (B7), produces: "who the relationship runs through, or Not determined (a gap Still open may ask)", sources: [F11, F1], status: always, check: C12}
    - {id: B8.hypotheses, part: What they may want (B8), produces: "up to three hypotheses, each with the claim that would disprove it", sources: [F12, S3-4], status: conditional, prints: "Depth deep", check: C13}
    - {id: B10.coverage, part: Coverage row (B10), produces: "n of 12 source types, what was not found, LinkedIn status", sources: [S2-4, S2-7], status: always, check: C16}
    - {id: B10.still_open, part: Still open row (B10), produces: "at most 4 questions for the room, highest value first", sources: [socratic.room], status: always, check: C12}
    - {id: B10.left_out, part: Left out on purpose row (B10), produces: "the excluded topics, never the facts", sources: [exclusions], status: always}
    - {id: B10.run, part: Run row (B10), produces: "date, depth, meeting type, prepared for, jurisdiction, status", sources: [profile], status: always}
    - {id: P.why, part: "Why lines (P1, P3, P4)", produces: "one line on why each move works", sources: [Q9], status: conditional, prints: "Q9 experience new", check: C15}
guardrails:
  never_say: ["Does that make sense?", "Is this helpful?", "No pressure", "You'd know better than me", "Just checking in"]
  forbidden_claims_by_domain:
    general: []
    wealth: [guaranteed, outperform, beat the market]
    pe: [guaranteed return, no downside]
    saas: [unlimited, zero risk]

# ------------------------------------------------------------------------------------------------
# 5. CHECKS -- every brief passes all before render. Each check names the command that runs it.
# ------------------------------------------------------------------------------------------------
checks:
  - {id: C1, name: swap,         cmd: "eval.py checks --swap",      passes_when: "no sentence in B1 or B3-B8 lacks both a [n] and a target-specific noun (headings, the tier line and Not determined lines aside)"}
  - {id: C2, name: bound,        cmd: "eval.py duf",                passes_when: "unbound == 0, dangling == 0, and every [n] in the body is a B10 row | [n] | what it says | source | grade | date | (tag and confidence stay in claims.jsonl)"}
  - {id: C3, name: quotes,       cmd: "eval.py checks --quotes",    passes_when: "every quoted string in B4 has a [n]"}
  - {id: C4, name: custom_q,     cmd: "eval.py checks --custom-q",  passes_when: ">= 2 questions in B2 carry a [n]"}
  - {id: C5, name: sections,     cmd: "eval.py checks --sections",  passes_when: "B1-B10 and P1-P9 present in order (P5 and P6 may be left out per S3-2)"}
  - {id: C6, name: budgets,      cmd: "eval.py checks --budgets",   passes_when: "no section exceeds its words by > 15%"}
  - {id: C7, name: never_say,    cmd: "eval.py checks --never-say", passes_when: "no never_say phrase appears outside P8"}
  - {id: C8, name: outcome,      cmd: "eval.py checks --outcome",   passes_when: "B5 contains no method verbs from checks.method_verbs"}
  - {id: C9, name: exclusions,   cmd: "eval.py checks --exclusions",passes_when: "no excluded topic keyword appears in the body"}
  - {id: C10, name: pages,       cmd: "format/talyx_pdf.py --style brief --brief-pages 2 --max-pages 3; eval.py pdf", passes_when: "exactly 3 pages: the brief on pages 1-2 with the evidence ledger last on page 2, the script on page 3, page 3 of 3 in the footer, a link for every ledger row not tagged Yours; page 3's numbered sections run 1, 2, 3 ... with no gap when a section drops"}
  - {id: C11, name: plain,       cmd: "eval.py checks --plain",     passes_when: "no plain_words.banned term or internal code outside quoted words"}
  - {id: C12, name: gaps,        cmd: "eval.py checks --gaps",      passes_when: "Still open holds at most 4 items, and at least one while B1-B9 show a gap (a Not determined **Label:** line or table cell, or a No read in B6); each item is 'Label: question?', the label a gap above, the question starting What, Who, How, When, Which, Where or If"}
  - {id: C13, name: conditional, cmd: "eval.py checks --conditional", passes_when: "B8's hypotheses only when the meta line says Depth deep; P6 only when B6 says Evidence tier: high; P5 not at tier low; B3's Recent wins line only with a dated, cited result (never Not determined or blank)"}
  - {id: C14, name: layout,      cmd: "eval.py checks --layout",    passes_when: "the brief has exactly the 9 blocks B1-B9 before B10, and B10 is its last block: no other block and nothing after the ledger; B9 has one label per line (The ask with its Fallback excepted); nothing prints '(not confirmed)', and the identity line prints nothing unknown"}
  - {id: C15, name: experience,  cmd: "eval.py checks --experience <Q9>", passes_when: "new: P1, P3 and P4 each have a **Why:** line of at most 12 words; experienced and top: no Why line; top: the Hook and each objection's answer are at most 15 words"}
  - {id: C16, name: linkedin,    cmd: "eval.py checks --linkedin",  passes_when: "B4 has exactly one **LinkedIn:** line: read from search results, read from your file, or not read: one of linkedin.reasons (a brief run before a linkedin.retired reason's day may give it); Coverage states the same; read from search results: a ledger row cites the linkedin.com/in profile the result showed; read from your file: no ledger row cites a linkedin.com/in profile (the file is cited); not read: no ledger row is tagged LinkedIn and Still open asks nothing about LinkedIn"}
  - {id: C17, name: cites,       cmd: "eval.py checks --cites (eval.py cites brief.md --fetch reads the pages too)", passes_when: "every cited sentence shares content with the ledger claim it cites (2+ content words, 1 when the claim is 3 words or fewer) and every [n] is a ledger row; a hypothetical (Reverses if, Stop if) carries no citation unless the row says it"}
  - {id: C18, name: quality,     cmd: "eval.py checks --quality",   passes_when: "no ledger row cites a source_quality.exclude domain; a source_quality.weak domain is never C1 or C2; fewer than 3 ledger rows carry the run's own date unmarked (those are read dates: give the source's date, or 'seen' when it has none)"}
  - {id: C19, name: render,      cmd: "eval.py pdf (also eval.py render OUT.pdf)", passes_when: "every page: no ink within 0.12in of a page edge, no word outside the 0.3in side margins; no page ends more than 0.5in above its footer margin; the schema's pairs (B3|B4, B5|B6, B7|B8) print side by side; page 1: the logo is whole in the top-right masthead; no block runs across a page break: page 2 opens on Who decides (B7, as in the schema) and no table prints its header row on two pages"}
  - {id: C20, name: colors,      cmd: "eval.py pdf (also eval.py render OUT.pdf)", passes_when: "every printed character is Midnight #0F2744, black #000000 or white #FFFFFF (no gray: the page must read when printed); the hairline #E8EAED is for rules only, never text"}
  - {id: C21, name: battery,     cmd: "eval.py checks --battery (the Run row); eval.py battery TRANSCRIPT --depth D [--brief brief.md or OUT.pdf] (the searches)", passes_when: "the Run row ends 'N searches (B base) in M rounds' (a brief run before osint.battery.since is exempt; the base count is required from osint.battery.base_since), N at least the base pass plus the depth's round floor; in the run's history (Claude Code, Codex, ChatGPT or Claude app: eval.py battery reads each) the base pass comes first, one search per source type the depth enables that has a query template, each carrying its template's terms; then the rounds, each a 'Round N (name):' line in the reasoning and the searches after it or, without such lines, one step's batch of searches, every round the depth enables in order, at least the battery's queries per round and the share with an operator or a domain filter, round 1's LinkedIn query through the domain filter; no linkedin.com page requested and no browser tool called; the reply holds no round line or query list, no text between the first and the last search, and at most five status lines of 30 words (a subagent's own text is not the reply); the Run row's counts match the history"}
  - {id: C22, name: ask,         cmd: "eval.py battery <history> [--profile ~/.pcp/profile.yaml] (also eval.py offer-conflict)", passes_when: "every question goes through the host's native question tool (a typed numbered list only where the host has none, or after an empty answer), with one line of the reply before it saying what skip does; no search, page open or file work between the question and the answer; a popup that came back empty is asked again in the reply; a request that names a business other than the saved offer was asked about before the first search"}
  - {id: C23, name: records,     cmd: "eval.py records <folder with claims.jsonl, coverage.json, read.json> --depth <depth> --brief brief.md", passes_when: "every claim has every field and valid tag, grade, confidence; coverage has every field, a count for each of the 12 source types equal to what claims.jsonl holds, rounds and searches, and a status S2-5 confirms; read.json has the six rubric dimensions with every field, the rubric's phrase for each band, and the tiers its observations support; the brief's source-type count, status and Evidence tier agree. Run it, and say what it reports, before the run is called done"}
  - {id: C24, name: kept,        cmd: "eval.py kept <first complete draft brief.md> <final brief.md>", passes_when: "every cited fact (ledger row) of the first complete draft is still a ledger row of the final brief and still cited in a sentence; a fact dropped for another reason (a dead link, an excluded topic) is named with --allow and told to the user"}
  - {id: C25, name: grading,     cmd: "eval.py checks --grading", passes_when: "from grading.since, every ledger row prints its grade (Measured, Derived, Inference, Not determined), how it was found (Direct, Search, LinkedIn, Yours) and its strength as one plain word (Strong, Solid, Weak, Inferred); the note line keys the four; a strength is never stronger than its caps allow (a weak domain, a Search or LinkedIn tag, a Derived or Inference grade): a weak source never reads Strong or Solid"}
  - {id: C26, name: schema,      cmd: "eval.py checks --schema; eval.py assemble --check <folder>", passes_when: "brief.md and script.md have exactly the structure of the forms table: the masthead, every block's heading and title in order, only the labels its form allows with the required ones present, its tables' headers, B9's subheads, the ledger's header and label grid, the script's title and subtitle; and, where fields.json exists, both files are byte for byte what eval.py assemble builds from it"}
  - {method_verbs: ["we scrape", "we ingest", "our pipeline", "our model", "we crawl", "our algorithm"]}

# ------------------------------------------------------------------------------------------------
# 6. EVAL + RATCHET -- the instrument comes before the feature. duf_pp is the north star.
# ------------------------------------------------------------------------------------------------
eval:
  metric: duf_pp
  definition: "decision-useful fact = a ledger number [n] that is (a) cited in B1-B9 or P1-P9, (b) a B10 row with what it says, source, grade and date (tag and confidence in claims.jsonl), (c) target-specific (passes swap). duf_pp = count / pages."
  positive_control: evals/fixtures/control_12.md   # exactly 12 bound facts, 0 unbound -> counter must report 12/0
  negative_control: evals/fixtures/control_broken.md   # 3 unbound, 1 missing source -> counter must report unbound 3, dropped 1
  frozen_targets_dir: evals/targets
  ratchet_file: evals/ratchet.json
  policy: floor_is_best_ever_never_regress
  baseline_required_before_claims: true   # an improvement claim is reported as baseline -> current with both commands, never asserted
