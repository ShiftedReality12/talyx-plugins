# pcp.yaml — THE registry for the pcp plug-in (v3.1.0).
#
# Every parameter, instruction, question, source family, rubric band and page budget lives here and
# nowhere else. skills/pre-call-prep/SKILL.md, commands/pcp.md, the Socratic reference, INVENTORY.md and pcp.json
# (this file as JSON, read by the scripts at run time) are GENERATED from this file by render_skill.py;
# eval.py `concordance` fails if they drift. A behaviour that is not a row here does not exist. Every
# `always` carries a `test:` (how it can be seen to fail). Every row carries `basis:`.
#
# Three contracts this file enforces, in order (dependency order, not discovery order):
#   1. INPUT CONTRACT     -- each stage declares its inputs (name, type, source, required, fallback)
#                            BEFORE any behaviour text.
#   2. CONTEXT CONTRACT   -- each stage declares what enters the context window, in what order, under
#                            what word budget. Nothing unlisted is read.
#   3. INSTRUCTION CONTRACT -- each instruction is a row {id, text, test, basis}. No row without a
#                            test reaches SKILL.md. Rows change only via a ratchet-passing edit here.

registry_version: 3.1.0
generated_files:
  - skills/pre-call-prep/SKILL.md
  - skills/pre-call-prep/references/socratic-questions.md
  - skills/pre-call-prep/references/osint-search.md
  - commands/pcp.md
  - INVENTORY.md
  - pcp.json
render_header: "<!-- GENERATED from pcp.yaml (sha256:{sha}) by render_skill.py -- edit pcp.yaml, never this file -->"

# ------------------------------------------------------------------------------------------------
# NAMES -- every user-facing name, once. Rows below write {deliverable}, {profile}, {script},
# {collection}; render_skill.py fills them in.
# ------------------------------------------------------------------------------------------------
names:
  deliverable: Intelligence Brief            # Sep 28: "intelligence brief" everywhere
  profile: Behavioral profile                # Oct 14 (Talyx for Daniel): the approved Oct 8 schema's title, which Ben signed off. One value.
  script: Meeting script
  collection: Intelligence collection        # Sep 28: "collect" -> "intelligence collection". Internal stage name; Daniel Oct 13: intel words are fine internally, banned only in rendered output (C11)
  classification: "INTERNAL | PREPARED FOR YOU | NOT FOR THE PERSON DESCRIBED"

# ------------------------------------------------------------------------------------------------
# PLAIN WORDS -- PCP thinks in intelligence concepts and writes in plain words (Oct 9).
# ------------------------------------------------------------------------------------------------
plain_words:
  rule: "Nothing the user reads -- the PDF, replies, setup questions, the listing -- uses military, intelligence-trade or technical jargon, or a grade or rule code (C3, S2-9): say 'a single, weaker source'. The closing reply too: after the call, offer 'after-call notes' (four fields), never a debrief. Their own quoted words are exempt."
  # Oct 16: the closing replies of R12 and R13 said "treat it as C3" and offered "the four-field debrief"; C11 now reads the reply (eval.py battery)
  banned: [OSINT, SOCINT, SOCMINT, HUMINT, human intelligence, SIGINT, intelligence cycle, tradecraft, collection plan, competing hypotheses, ACH, target package, asset, source handling, exploitation, debrief, kill chain, dossier, duf_pp, claims.jsonl, read.json, source families, scrape, scraped, scraping, crawl, LLM]
  # a banned word inside one of these phrases is the finance term, not the trade word ("asset" = a recruited source)
  # (red-team Oct 13: wealth and bank briefs print these daily -- J.P. Morgan's "Asset & Wealth Management", NAV, a bank's asset quality)
  allowed: [asset manager, asset managers, asset management, asset & wealth management, asset and wealth management, asset class, asset classes,
            asset allocation, asset owner, asset owners, asset-light, asset-heavy, asset-backed, asset-based, asset-liability, asset and liability,
            asset base, asset quality, asset growth, asset mix, asset value, asset values, net asset value, asset price, asset prices,
            asset sale, asset sales, asset purchase, asset purchases, asset deal, asset finance, asset servicing, asset gathering,
            real asset, alternative asset, digital asset, fixed asset, financial asset, hard asset, single-asset, multi-asset]
  # Oct 9 / AID-58: Ben's executive words. Not enforced until Daniel decides (spec Q3, Q5); move a word to banned to adopt it.
  pending: [intelligence collection, counter-evidence]   # behavioral profile left the list Oct 14: it is block 6's approved title
  # the deliverable has one name (names.deliverable); build/adapters.py --check fails on these anywhere in the repo
  names_banned: [pre-call brief, call brief, meeting brief, dossier, one-pager]
  codes: '\b(?:C[1-4]|F(?:1[0-2]|[1-9])|S[0-5]-\d+)\b'   # internal ids never print
  # consumer-facing copy (SKILL.md, commands, references, INVENTORY, READMEs, listing, chat-app files) carries no internal notes:
  # no team names, meeting notes, ticket or run ids, or '(Oct 14)' provenance. They stay in basis fields and comments.
  internal: '\b(?:Ben|Benjamin|Danny|Daniel)\b|Notes by Gemini|\bmeeting notes\b|\bAID-\d+\b|\bR\d{1,2}b?\b|\((?:[A-Z][a-z]+,? )?(?:Sep|Oct|Nov|Dec) \d{1,2}(?:\)|:)'
concepts:   # internal: how PCP thinks; none of these words reach the user
  - "Work the intelligence cycle: direction (setup and the meeting objective) -> collection -> processing (each fact gets a source, tag, grade and date; excluded topics are dropped) -> analysis -> the {deliverable} -> feedback (the debrief)."
  - "Collection is open sources found by targeted web search in rounds, each refined from the last (osint), the person's public social footprint, LinkedIn only as its public search results show it (never a browser session), and the user's own files and answers (a LinkedIn profile they save is one)."
  - "{profile} is human-source analysis from public evidence: each row is a cited observation and the caller's move. It never labels the person's character."
  - "Keep what was read apart from what was inferred (the grade). Check the one assumption the Take rests on (Strongest case against). On deep runs, weigh competing explanations of what they want."

# ------------------------------------------------------------------------------------------------
# SOCRATIC QUESTIONS -- rendered to skills/pre-call-prep/references/socratic-questions.md.
# ------------------------------------------------------------------------------------------------
socratic:
  ask_user:
    rule: "Ask the user only when a trigger below fires: at most 2 questions per run after setup, in one message, each skippable. Never ask what the record or the saved setup already answers. Answers are the user's own facts: tag Yours."
    triggers:
      - {when: "No meeting objective in the intake", ask: "What do you want to walk out of this meeting with?"}
      - {when: "Two or more people match the name", ask: "Which of these is the person you're meeting?"}
      - {when: "The intake says you already know them, and no notes came with it", ask: "When did you last speak, and what did they tell you that isn't public?"}
      - {when: "You mention notes, a CRM record, a Slack or Google Chat thread, a saved LinkedIn PDF or a profile on them", ask: "Can you paste it or give me the file? I'll mark it as yours, not public."}
      - {when: "Who decides, the gate or the timing is still Not determined after collection", ask: "Who else has a say in this, as far as you know?"}
  room:
    rule: "Every Not determined (a **Label:** line or a table cell) and every No read in the {profile} is a gap. The ledger's Still open row asks at most 4 of them in the room, highest value first (who decides and the gate before the {profile}), each as 'Label: question?' in at most 10 words, items separated by ' · '. Open, non-leading, one idea each; never filler."
    max_open: 4   # Daniel, Oct 14: Still open is at most 4 short questions, highest value first
    question_starts: [What, Who, How, When, Which, Where, If]
    kinds:
      - {kind: Clarify, use: "a word or priority they use but don't define", example: "When you say {their word}, what does that look like at {organization}?"}
      - {kind: Assumption, use: "the read rests on something unconfirmed", example: "What would have to be true for {plan} to make sense this year?"}
      - {kind: Evidence, use: "a fact with one weak source", example: "What have you seen that tells you {claim}?"}
      - {kind: Viewpoint, use: "who decides, or who else matters, is unknown", example: "Who else will weigh in on {decision}, and how do they see it?"}
      - {kind: Consequence, use: "urgency or timing is unknown", example: "If nothing changes on {issue}, what happens by {date}?"}

# ------------------------------------------------------------------------------------------------
# 0. CALIBRATION -- asked ONCE (two question-form calls of 4, then one free-text question), stored at
#    ~/.pcp/profile.yaml. Every question writes >= 1 row (`sets`). A question that sets nothing is a defect.
# ------------------------------------------------------------------------------------------------
calibration:
  profile_path: ~/.pcp/profile.yaml
  reask_flag: --recalibrate
  profile_flag: --profile
  context_file_types: [.pdf, .docx, .md, .txt, .csv]   # Q8 and --context; anything else is refused in one line
  calls: [[Q1, Q2, Q3, Q4], [Q5, Q6, Q7, Q9], [Q8]]
  questions:
    - id: Q1
      header: Your role
      question: Who is making the call?
      options:
        - {label: Founder / principal (Recommended), value: principal, description: You own the relationship and the offer.}
        - {label: Sales / BD, value: sales, description: You open and advance deals for your firm.}
        - {label: "Advisor / relationship manager", value: advisor, description: "Wealth, legal, accounting or other professional advisor."}
        - {label: Investor / allocator, value: investor, description: You deploy capital or diligence managers.}
      sets: {caller.role: value, caller.authority_level: "principal->high, sales->medium, advisor->medium, investor->high"}
      consumed_by: [script.influence_depth, brief.value_next_step]
    - id: Q2
      header: Domain
      question: Where do your targets mostly live?
      options:
        - {label: General professional (Recommended), value: general, description: No domain assumptions; broadest source set.}
        - {label: "Wealth management", value: wealth, description: "Advisors, RIAs, family offices; adds BrokerCheck/IAPD registers."}
        - {label: "Private equity / VC", value: pe, description: "GPs, LPs, portfolio companies; adds fund and portfolio news."}
        - {label: Enterprise / SaaS, value: saas, description: Buyers and champions in technology companies.}
      sets: {domain: value}
      consumed_by: [families.registers, brief.vocab, guardrails.forbidden_claims]
    - id: Q3
      header: Target kind
      question: Who do you usually prep for?
      options:
        - {label: A person (Recommended), value: person, description: One named counterpart.}
        - {label: A company or team, value: company, description: An account; people come second.}
        - {label: A deal or transaction, value: deal, description: A live process with several parties.}
        - {label: Mixed, value: mixed, description: Decide per run from the intake.}
      sets: {target.kind_default: value}
      consumed_by: [families.enabled_by_kind]
    - id: Q4
      header: Meeting
      question: What is the typical call?
      options:
        - {label: First intro (cold or warm) (Recommended), value: intro, description: Earn the second meeting.}
        - {label: Discovery / qualification, value: discovery, description: Learn enough to decide fit.}
        - {label: Pitch / close, value: close, description: Move to a decision.}
        - {label: Relationship / renewal, value: relationship, description: Deepen an existing relationship.}
      sets: {meeting.format_default: value}
      consumed_by: [script.beats, brief.discovery_questions.mix]
    - id: Q5
      header: Depth
      question: Research depth versus speed?
      options:
        - {label: "Standard -- 12 source types, about 8 minutes (Recommended)", value: standard, description: "Full public footprint, counter-evidence pass on."}
        - {label: "Fast -- 6 source types, about 3 minutes", value: fast, description: "Identity, org, voice, news, registers, social. No counter-evidence."}
        - {label: "Deep -- every source type + what they may want", value: deep, description: "Adds what they may want from the meeting, and a second pass on their network."}
      sets: {research.depth: value}
      consumed_by: [families.enabled_by_depth, research.full_threshold, rubric.ach]
    - id: Q6
      header: Social
      question: Public social footprint -- how far?
      options:
        - {label: "Professional only (Recommended)", value: professional, description: "Public bios, talks, podcasts, and LinkedIn as public search results show it. Never your browser or your account."}
        - {label: "Plus public X / Bluesky / Substack", value: social, description: "Public posts on open networks only."}
        - {label: None, value: none, description: No social sources at all.}
      sets: {socmint.scope: value}
      consumed_by: [families.socmint]
    - id: Q7
      header: Compliance
      question: Jurisdiction and compliance posture?
      options:
        - {label: US (Recommended), value: us, description: Public professional record; standard exclusions.}
        - {label: UK / EU (GDPR strict), value: eu, description: "Adds minimisation: working notes are deleted once the PDF renders."}
        - {label: Regulated sales (FINRA / FCA style), value: regulated, description: Adds performance-claim and promissory-language guardrails.}
        - {label: APAC, value: apac, description: Standard exclusions; formal-register openers.}
      sets: {jurisdiction: value}
      consumed_by: [exclusions, guardrails.never_say, retention]
    - id: Q9
      header: Experience
      question: How long have you been running meetings like this?
      options:
        - {label: "Experienced (Recommended)", value: experienced, description: "The moves, without coaching."}
        - {label: "Newer -- under two years", value: new, description: "Each move on page 3 comes with a one-line why."}
        - {label: Top producer, value: top, description: "The shortest lines; you adapt in the room."}
      sets: {caller.experience: value}
      consumed_by: [script.why_lines, script.say_aloud_words]
    - id: Q8
      header: Your offer
      question: "In one line -- what do you offer, and what does a win in this meeting look like? If you have files about your business (a deck, a one-page summary, case studies -- PDF, Word, Markdown, text or CSV), add their paths and PCP will use them. (free text)"
      options: []
      free_text: true
      sets: {caller.offer_one_line: text, meeting.win_definition: text, context.files: paths}
      consumed_by: [checks.swap_test, eval.duf_binding, brief.B9]
  rules:
    - id: CAL-1
      text: "Ask only the questions with no saved answer in ~/.pcp/profile.yaml -- all of them the first time, all again with --recalibrate. Otherwise read it silently."
      test: "A profile with Q1-Q8 answered and no Q9 -- the run asks Q9 only. A complete profile -- it asks nothing."
      basis: design choice, rapid one-time questions
    - id: CAL-2
      text: A skipped answer takes the first (Recommended) option and is stored with defaulted:true; the masthead's Prepared for and Depth show the saved answers.
      test: Skip Q5 -- profile shows research.depth standard, defaulted true; the masthead reads "Depth standard".
      basis: verify at value level
    - id: CAL-3
      text: The improve loop may PROPOSE a profile change (one line, with the debrief evidence) but never applies one without a yes.
      test: Three debriefs with facts_used > 80% must produce a proposal, and the profile must be unchanged until answered.
      basis: design choice, no silent adaptation
    - id: CAL-4
      text: "Files named in Q8 (or later with --context <path>) are read once; their paths and a summary of at most 150 words go in the profile under context. Facts taken from them are tagged Yours, never presented as public. Supported: .pdf .docx .md .txt .csv. Any other file gets one line naming the supported types, and the profile is left unchanged."
      test: "Give a one-page file -- the profile holds its path and summary, and a fact from it prints with tag Yours. Give a .pptx -- one line names the supported types and profile.yaml's sha256 is unchanged."
      basis: "Oct 9: a user with a business context profile can upload files"

# ------------------------------------------------------------------------------------------------
# 1. STAGES -- input contract + context contract + instruction rows, per stage, dependency-ordered.
# ------------------------------------------------------------------------------------------------
stages:
  - id: S1
    name: Intake
    inputs:
      - {name: arguments, type: "path.csv | 'Full Name, Organisation' | empty", source: $ARGUMENTS, required: true, fallback: ask the required intake fields in one message}
      - {name: profile, type: yaml, source: ~/.pcp/profile.yaml, required: true, fallback: run calibration}
      - {name: meeting.objective, type: text, source: intake row or one question, required: true, fallback: "ask: What do you want to walk out of this meeting with?"}
      - {name: target.kind, type: "person|company|deal", source: intake or profile.target.kind_default, required: true, fallback: person}
    context:
      order: ["profile", "intake row", "this stage's rows", "references/socratic-questions.md"]
      budget_words: 900
      excluded: ["reference files of later stages", "prior briefs"]
    rows:
      - {id: S1-1, text: "Do not start research without a full name and an organisation.", test: "Run with a name only -- the run must ask, not search.", basis: original plugin v1}
      - {id: S1-2, text: "Two or more people match the name: stop and ask which one. Wrong-person research is worse than none.", test: "Seed an ambiguous name -- the run must present the candidates and stop.", basis: original plugin v1}
      - {id: S1-3, text: "Up to 8 targets per run; research targets in parallel, write briefs in turn.", test: "A 9-row CSV must be refused with the count.", basis: original plugin v1}
      - {id: S1-4, text: "Ask the user only as references/socratic-questions.md says: when a trigger fires, at most 2 questions after setup, in one message, each skippable.", test: "An intake with an objective and no relationship -- the run asks nothing before collection.", basis: "Daniel, Oct 12: Socratic questions the plug-in asks the user as needed"}

  - id: S2
    name: "{collection}"
    inputs:
      - {name: resolved_families, type: list, source: "families filtered by profile (kind, depth, socmint)", required: true, fallback: none -- derived}
      - {name: exclusions, type: list, source: "exclusions.base + exclusions.by_jurisdiction[profile.jurisdiction]", required: true, fallback: none -- derived}
      - {name: known_context, type: text, source: "intake Notes column, the user's answers, profile.context and any file the user gives", required: false, fallback: empty}
    context:
      order: ["resolved_families with query templates", "exclusions", "target identity", "known_context"]
      budget_words: 1200
      excluded: ["rubric", "brief structure", "script structure"]
    outputs:
      - {name: claims.jsonl, fields: [id, claim, family, url, retrieved_at, published, tag, grade, confidence, exclusion_hit]}
      - {name: coverage, fields: [rounds (each query as sent, operators the search ignored), families_attempted, families_total, hits_by_family, failed_urls, linkedin, status]}
    rows:
      - {id: S2-1, text: "Public sources found by targeted web search in rounds (osint), plus what the user gives: their files and answers (tag Yours), a LinkedIn profile they save among them (S2-7). LinkedIn itself only as its public search results show it; never a signed-in or automated browser. No paid data the user has not supplied; nothing collected in bulk.", test: "A run with no files and no answers holds only Direct, Search and LinkedIn facts, and its transcript requests no linkedin.com page.", basis: "original plugin v1; Sep 28: use what people already have"}
      - {id: S2-2, text: "Every claim carries url (or the file name, for Yours), retrieved_at, published (the source's own publication or event date; none when the source is undated), tag Direct|Search|LinkedIn|Yours, grade Measured|Derived|Inference|Not determined, and confidence C1 (primary, dated) | C2 (reputable secondary) | C3 (single weak source) | C4 (inferred).", test: "A claim missing any field is dropped by eval.py duf and counted as dropped.", basis: a confidence ladder; Ben's grades (Oct 7)}
      - {id: S2-3, text: "A claim that hits an exclusion is dropped BEFORE the writer sees it and counted in coverage.excluded; the ledger's Left out on purpose row names the topic, never the fact.", test: "Seed a claim tagged exclusion health -- it must not appear in any output file.", basis: original plugin v1 + every rule carries a falsification test}
      - {id: S2-4, text: "Coverage is a required output: families_attempted/families_total and hits per family. A run without coverage is not a run.", test: "Disable WebFetch -- coverage must show 0/N attempted and status LIMITED, never FULL.", basis: never truncate silently}
      - {id: S2-5, text: "Status FULL requires >= 1 C1/C2 claim in >= research.full_threshold[depth] families; else LIMITED, stamped in the masthead.", test: "Remove all C1/C2 claims from one family below threshold -- status flips to LIMITED.", basis: "original plugin FULL/LIMITED, made numeric"}
      - {id: S2-6, text: "Run the counter-evidence family last: search for what would contradict the strategic read.", test: "With depth standard or deep, coverage must show family F12 attempted.", basis: analysis of competing hypotheses}
      - {id: S2-7, text: "LinkedIn is read the way the rest of the record is: by targeted web search in rounds (osint; references/osint-search.md), from the result text the host's search tool returns. Never request a linkedin.com URL, sign in, or open or drive a browser session (osint.never). With social scope none, or when the user says not to, run no LinkedIn query: 'not read: scope none' or 'not read: you declined'. A LinkedIn result is used only once it passes the identity lock (osint.identity_lock); when none passes: 'not read: no matching profile'. Its facts are graded as osint.grading says: tag LinkedIn, C3, cited [linkedin.com, search result](the URL the result lists) -- a profile, post or article alike, since none is opened -- dated 'seen <today>', and 'per their LinkedIn' in a sentence that rests on it alone. Optional (under review): when the user gives the person's LinkedIn profile saved as a PDF or copied text, read it as their file (tag Yours, cited by the file name; 'read from your file'); the run never waits for one. Every run states LinkedIn's status, the same in two places, B4's last line and the Coverage row: '**LinkedIn:** read from search results' or 'read from your file', or '**LinkedIn:** not read: <reason>', the reason one of linkedin.reasons word for word; not read: no fact is tagged LinkedIn. An unread LinkedIn is stated in Coverage only, never as a Still open question.", test: "A run on a public executive requests no linkedin.com URL and calls no browser tool (its transcript shows search calls only, for LinkedIn); the profile's search result is a ledger row cited to linkedin.com/in, and B4 and Coverage read 'LinkedIn: read from search results'. A LinkedIn post cited as [linkedin.com](...) fails C16. The identity-lock example reads 'not read: no matching profile'. A brief that says 'read in your browser' fails C16 (fixtures linkedin_search.md, linkedin_browser.md, linkedin_declined.md, linkedin_missing.md, linkedin_declined_with_row.md).", basis: "Oct 14 Ben/Danny meeting, AID-63: replace the browser opt-in (b5f1b88: the user's signed-in browser, which LinkedIn's terms bar for automated tools) with multi-round targeted search, public search results only. OSINT review Oct 15: platform terms, identity lock, grading, the round plan. AID-62 (a saved profile PDF) stays optional until Daniel decides; before Oct 15 the run asked for it and waited (28a2350)."}
      - {id: S2-8, text: "Source quality: prefer the primary source (the organisation, filings, the person's own words). Never cite a source_quality.exclude domain (people-search and unreachable sites); a source_quality.weak domain is at most C3 and never the only support for a fact on page 1. Cite a fact only where the ledger row says it: hypotheticals (Reverses if, Stop if) carry no citation. Before render, check every link (eval.py links brief.md): dead links are replaced or the fact is dropped; blocked links (the site refuses bots) are kept.", test: "A brief citing mexc.com as C2 fails C18; a Reverses if line citing the intake row fails C17; the link check reports blocked separately from dead.", basis: "Live test runs Oct 13 (R1 weak sources, R2 citations on hypotheticals)"}
      - {id: S2-9, text: "Research is the search battery (osint), and it is mandatory: every round the depth enables, in order -- round 1 (the identity lock, its LinkedIn query among them) before any other search, round 5 last -- each with at least the battery's queries per round, most of them with an advanced operator or the tool's domain filter. Before each round, state its line, 'Round N (name): <query> | <query> | ...'; then send that round's queries together, in one step, and no other search until the next round; from round 2 on they carry what the rounds before found. The battery adds searches and never replaces reading: open the page behind every result you cite (LinkedIn aside) -- before you write the ledger, check each row's link against the pages you opened, and open the rest or drop their facts -- and the fact floor (S4-11) still holds. Count every search sent: the Run row ends 'N searches in M rounds'.", test: "eval.py battery <the run's transcript> --depth <depth> (C21) fails a run that skips a round its depth enables, splits a round over several steps, sends fewer than the battery's queries in a round or too few with operators, searches before its Round 1 line, sends round 1's LinkedIn query as typed site: where the tool has a domain filter, prints a Run row whose counts differ from the transcript, or cites a page it never requested (LinkedIn aside; a page that refused the fetch was requested).", basis: "The Oct 15 runs R10 and R10b fail it. R11b (Oct 15, 3cd0427) passed the battery but cited 5 results from their snippets alone; R11 cited 6, R10b 5. The chat-app reply A6 (Oct 16, 635c146) batched all 5 rounds but stated only round 1's line. R11 (Oct 15, aaf571f) ran the battery (22 searches, 20 with operators) but wrote its round lines only in its reasoning, and cited 5 facts from unopened results (14 facts, down from 18). Ben, Oct 14 (01:05:03): 'comprehensive depth open-source intelligence collection ... a battery of advanced search operators or chain linking advanced search operators ... four or five rounds of Google dorks.' The Oct 15 consumer runs sent 11 searches, mostly plain sentences, with no intitle:, inurl:, filetype: or date operator: the plan was guidance, not a battery."}

  - id: S3
    name: "{profile}"
    inputs:
      - {name: claims.jsonl, type: jsonl, source: S2, required: true, fallback: none}
      - {name: rubric, type: rows, source: pcp.yaml rubric, required: true, fallback: none}
      - {name: authority_level, type: "high|medium", source: profile.caller.authority_level, required: true, fallback: medium}
    context:
      order: ["rubric dimensions + bands", "claims tagged family in F1/F5/F6/F7", "authority_level"]
      budget_words: 1500
      excluded: ["claims of other families", "brief structure"]
    outputs:
      - {name: read.json, fields: [dimension, band, evidence_tier, observation_ids, meeting_meaning]}
    rows:
      - {id: S3-1, text: "Read each of the six dimensions only from observation_ids in claims.jsonl; a band with fewer observations than its tier minimum is reported as 'no read' -- never guessed from role.", test: "A target with only role-archetype claims must render every dimension as tier low and the script must contain no influence sequence.", basis: rubric v1.1 evidence tiers}
      - {id: S3-2, text: "B6's evidence tier is the highest tier at least three of the six dimensions reach (a no read counts as low). It gates page 3: low -> no Read the room (P5); high AND authority_level high -> Influence (P6). Otherwise P6 is left out.", test: "Delete one corroborating claim -- the tier must drop and P6 must disappear on re-run.", basis: an evidence gate}
      - {id: S3-3, text: "Every Your move in B6 is a rubric meaning in pcp.yaml, word for word, or No read; no band phrase is written in prose.", test: "Grep B6 for a move not in rubric.*.meaning -- the run is rewritten.", basis: generated files are never hand-edited}
      - {id: S3-4, text: "Depth deep adds what they may want: <= 3 hypotheses about what the person wants from this meeting, each with the claim that would disprove it.", test: "Depth standard -- no hypotheses table in B8; depth deep -- the table, with a disproving claim [n] per hypothesis.", basis: analysis of competing hypotheses}

  - id: S4
    name: "{deliverable}"
    inputs:
      - {name: claims.jsonl, type: jsonl, source: S2, required: true, fallback: none}
      - {name: read.json, type: json, source: S3, required: true, fallback: none}
      - {name: profile, type: yaml, source: ~/.pcp/profile.yaml, required: true, fallback: none}
      - {name: page_budget, type: rows, source: pcp.yaml brief + script, required: true, fallback: none}
    context:
      order: ["brief sections with word budgets", "script beats and sections", "claims (C1/C2 first)", "read.json", "profile.caller", "guardrails"]
      budget_words: 3000
      excluded: ["rubric evidence lists", "family query templates"]
    outputs:
      - {name: brief.md, note: "pages 1-2"}
      - {name: script.md, note: "page 3"}
      - {name: "<out>/<date>-<slug>-intelligence-brief.pdf", note: "ONE 3-page PDF via format/talyx_pdf.py --style brief --brief-pages 2 --max-pages 3; the script on page 3"}
    rows:
      - {id: S4-1, text: "Every fact in B1-B9 and the script cites a ledger number [n]; the ledger (B10) lists only cited facts, numbered in order of first use. A fact with no citation is a defect, not a style choice.", test: "eval.py duf reports unbound or dangling > 0 -- the run must rewrite before render.", basis: DUF metric definition}
      - {id: S4-2, text: "Every sentence passes the swap test against caller.offer_one_line and the target: if another target's name would leave it true, delete it.", test: "A brief with a sentence containing no claim id and no target-specific noun fails checks.swap.", basis: "original plugin check 1, tightened to sentence"}
      - {id: S4-3, text: "Where the host can run scripts and a browser engine (Claude Code, Claude Cowork, Codex, ChatGPT agent or work mode), render ONLY through format/talyx_pdf.py --style brief --brief-pages 2 --max-pages 3, never Markdown or HTML as the deliverable. The PDF is exactly 3 pages: the brief fills pages 1-2 (a short brief puts the evidence ledger on page 2 -- never filler) and the script is page 3. Check it with eval.py pdf. Where render is impossible, follow S4-10.", test: "On a script-capable host the output directory contains exactly one .pdf and no .md/.html after a run; eval.py pdf on it exits 0 (3 pages, the script on page 3 only, the ledger on page 2).", basis: "design choice, PDF first; AID-8: meeting script on page 3; Daniel Oct 13: PDF where scripts run"}
      - {id: S4-11, text: "Fact density (the ratchet's metric, decision-useful facts per page, never drops). Standard depth aims at 18 or more distinct cited facts across the 3 pages, at least 6 per page. Spend words on facts, not framing: a line that can carry a new cited fact carries one; cut uncited connective sentences; each B2 question, B3 bullet, B5 row, B8 bullet and P3 answer rests on a different [n] where the evidence allows. Before writing Not determined for Role since, Path, The organization or Decision maker, run one targeted search of the primary source (official bio, annual report or proxy statement, newsroom); for a public company these are almost always public. The ledger's What it says stays under 8 words so each row is one line. Each No read or Not determined is a gap on the page, so evidence that fills one frees space for a fact: search two long-form interviews or earnings-call remarks for the six reads before writing No read. Keep each Still open question under 10 words. Before rendering, run eval.py duf: below 6.0 per page, replace a repeated [n], an uncited line or a filled-in-able gap with a new cited fact from the claims, then re-check fit; if the brief overflows, cut words, not facts.", test: "eval.py ratchet: every frozen target's duf_pp meets its floor at 10 pt and 3 pages.", basis: "Daniel, Oct 14: floors never drop; recover density by wording, budgets and fact selection"}
      - {id: S4-10, text: "In-chat fallback. Render is impossible when the host has no shell or code tool, python3 is missing, or talyx_pdf.py exits for want of a browser engine (after one try of --setup where installs are allowed). Then deliver the full brief in the chat, never a summary: first line exactly 'Intelligence Brief (in chat: this app cannot make the PDF, so the same 3 pages follow as text)'; then the masthead lines; then the line '--- Page 1 ---' and B1-B6; '--- Page 2 ---' and B7-B10 with the same 5-column ledger (each row starts '| [n] |', the source a link or 'your request' / 'your saved setup') and its Coverage / Still open / Left out on purpose / Run rows; '--- Page 3 ---' and '# Meeting script' with P1-P9. Same blocks, order, titles, word budgets, citations [n], grades and plain-words rules as the PDF. Build the ledger from your claim list before writing the blocks, number facts in order of first use, and cite only those numbers; drop a row nobody cites. Never cite a source_quality.exclude domain. Action and Avoid in B1 each cite a fact. Every ledger row has a grade (Measured, Derived, Inference) and the source's own date 'Mon D, YYYY' ('seen Mon D, YYYY' only for an undated source). The LinkedIn line is a plain line after B4's bullets, never a bullet. Still open items are '<the exact label as printed>: <What/Who/How/When/Which/Where/If ...?>' joined by ' · ', at most 4, highest value first, each label a Not determined or No read above. Thin or no evidence never changes the shape: keep every block title and fill it with Not determined or No read; the top 4 gaps get a 'Label: question?' in Still open (S4-7). If a code tool exists, run eval.py checks on it; otherwise, before sending, check yourself, one line at a time, against these worked examples: (1) the first line is the label itself, nothing before it; (2) count B1's words: at most 60, e.g. '**Take.** Jane Doe has led Alder Grey since 2021 [1] and buys patience [3]. **Evidence:** her 2021 start [1] and her letter's 'we buy patience' [3]. **Action:** open on her letter [3]. **Avoid:** a fee-led pitch [4].' -- Evidence names the facts in words, never bare numbers; (3) P9 is one line of at most 25 words, e.g. '**Next step:** send the one-page example by Oct 17.', and nothing follows it but the Checks line -- no note, caveat or offer; (4) a hypothetical or a thing to learn carries no [n] unless the cited row says it, e.g. '**Reverses if:** she names a tooling owner.', '**Stop if:** they say tooling is settled.' and '**Capture:** who owns AI choices.'; (5) each Still open item is 'Label: question?' starting What, Who, How, When, Which, Where or If, never Does, Is, Can or Do, e.g. 'Decision maker: Who signs off?'; at most 4, each on a gap above; (6) Recent wins carries a date and a citation, e.g. '**Recent wins:** Jul 30, 2026: Azure passed $100 billion [3].', or the line is left out; (7) every sentence in B1 and B3-B8 carries a [n] or names the person or organization, e.g. 'Outside prep may look redundant to Microsoft [4].', never a bare 'Outside prep may look redundant.'; (8) block titles exactly as listed and in order, with no numbers ('## Take', '## Questions that close gaps'); only the script's sections are numbered; (9) the deliverable is only ever the Intelligence Brief, never a meeting brief, call brief, dossier or one-pager, even for the sample you bring; (10) a ledger date that is today's date is the day you read the source: write 'seen Oct 14, 2026' unless the source itself is dated today; rows from your request or your saved setup are always 'seen <today>'; (11) count every block against its budget, B9 included (at most 120 words); (12) no Left out on purpose topic appears anywhere, not even as a source name (no donations, no FEC filings); (13) every [n] in the ledger and every ledger row cited, no banned word; (14) each ledger row's What it says repeats the key words of the sentence that cites it, e.g. 'called for an AI emergency brake [3]' cites '| [3] | Called for an AI emergency brake |', not '| [3] | Oct 10 post: contain the model |'. End with 'Checks: self-reviewed, not run as code'.", test: "Run with no Bash tool: the reply holds the label, the three page markers, every B1-B10 and P1-P9 title in order, a ledger row per cited [n], and no plain_words.banned word; eval.py chat on the saved reply exits 0.", basis: "Daniel, Oct 13: plain chat in ChatGPT or Claude falls back to the full brief in chat"}
      - {id: S4-4, text: "If the tightest density rung still overflows 3 pages, the run FAILS with the section word counts; it never truncates or spills. An overflow is fixed only by cutting words in the sections the renderer names; never change --columns, --brief-pages or --max-pages, never drop or move a block.", test: "Feed a 900-word section -- the engine must exit non-zero naming the section.", basis: never truncate silently}
      - {id: S4-5, text: "The masthead's meta line carries meeting, prepared for, depth, sources, status and date; the ledger's Run row carries the run details; the footer carries only the {deliverable}, the person and the page numbers. The identity line is organization | role, since year | city: the city only when a source confirms it; anything unconfirmed or unknown is left out, never printed as '(not confirmed)', 'not published' or 'Not determined'.", test: "Extract page 1 text -- the meta line has all six fields; no page footer holds a metric.", basis: "Oct 7: run details under the sources"}
      - {id: S4-6, text: "A block or line prints only as its Prints when says: a line PCP cannot fill from evidence is left out, or reads Not determined where its row says so. Never filler.", test: "No recent wins found -- the Recent wins line is absent, not blank or padded.", basis: "Oct 9: if we can't produce it, parameterize it so it's conditional"}
      - {id: S4-7, text: "Every Not determined -- a **Label:** line or a table cell -- and every No read in B6 is a gap; the ledger's Still open row asks at most 4 of them, highest value first, as 'Label: question?', as references/socratic-questions.md says.", test: "Write five Still open questions, or one whose label is no gap above, or none while gaps exist -- eval.py checks fails C12 (fixtures control_broken.md, gaps_table.md).", basis: "Oct 9: Socratic questioning reference for things it can't find"}
      - {id: S4-8, text: "Plain words: nothing printed uses a plain_words.banned term or an internal code; the person's own quoted words are exempt.", test: "Put SOCMINT in B3 -- eval.py checks fails C11.", basis: "Oct 9: don't use mil/intel/tech words in actual outputs"}
      - {id: S4-9, text: "Experience (Q9) shapes page 3 only: new -> P1, P3 and P4 each end with a **Why:** line of at most 12 words; top -> the Hook and each objection's answer are at most 15 words; experienced -> neither.", test: "Set Q9 new -- P1, P3 and P4 each carry a Why line; set experienced -- none does. eval.py checks --experience <Q9> fails C15 otherwise (fixtures exp_new.md passes as new, exp_experienced_with_why.md fails as experienced).", basis: "Oct 9: different levels of experience"}

  - id: S5
    name: Debrief + ratchet
    inputs:
      - {name: debrief.yaml, type: yaml, source: "user, after the call (60 seconds, 4 fields)", required: false, fallback: skip loop}
      - {name: ratchet.json, type: json, source: evals/ratchet.json, required: true, fallback: initialise empty}
    context:
      order: ["ratchet floors", "debrief rows", "the pcp.yaml rows the debrief touches"]
      budget_words: 800
      excluded: ["everything else"]
    rows:
      - {id: S5-1, text: "A change to pcp.yaml lands only if eval.py ratchet passes: every frozen target's duf_pp >= its floor AND all checks pass. The floor is the best ever seen and only rises.", test: "Lower a family weight so a target's duf_pp drops -- ratchet must exit non-zero and name the target.", basis: "design choice, floor = best ever"}
      - {id: S5-2, text: "Debrief fields: facts_used[claim ids], questions_landed[ids], band_accuracy{dim: hit|miss}, outcome. Nothing else is asked.", test: "The debrief template has exactly four fields.", basis: path of least resistance}
      - {id: S5-3, text: "improve proposes row diffs (family weights, question templates, band phrases) as a patch with basis: debrief_id; it never edits SKILL.md and never lands a diff itself.", test: "Run improve -- the only file written is evals/proposals/<date>.patch.", basis: generated files are never hand-edited}

# ------------------------------------------------------------------------------------------------
# 2. SOURCE FAMILIES -- the collection plan. enabled_by_* are filters over profile answers.
# ------------------------------------------------------------------------------------------------
families:
  - {id: F1,  name: identity,            weight: 1.0, socmint: false, depth: [fast, standard, deep], kinds: [person, company, deal], query: '"{name}" "{org}" {title}', extract: "current role + start date, prior roles, education, credentials, boards, awards"}
  - {id: F2,  name: career timeline,     weight: 0.8, socmint: false, depth: [standard, deep],       kinds: [person],                 query: '"{name}" {org} career OR joined OR appointed OR promoted', extract: "dated moves; the last 24 months first"}
  - {id: F3,  name: org news,            weight: 1.0, socmint: false, depth: [fast, standard, deep], kinds: [person, company, deal], query: '"{org}" news OR announces OR partnership OR acquisition OR raises {year}', extract: "deals, leadership changes, launches, growth or contraction, anything the target led"}
  - {id: F4,  name: org self-description,weight: 0.6, socmint: false, depth: [standard, deep],       kinds: [person, company, deal], query: '{org_website} about OR mission', extract: "how the org describes itself in its own words"}
  - {id: F5,  name: voice,               weight: 1.0, socmint: false, depth: [fast, standard, deep], kinds: [person],                 query: '"{name}" interview OR podcast OR panel OR quoted OR keynote', extract: "exact quotes with URL; recurring themes; the words they use for their own work"}
  - {id: F6,  name: public social,       weight: 0.7, socmint: true,  depth: [fast, standard, deep], kinds: [person],                 query: '"{name}" site:linkedin.com/posts OR site:x.com OR site:substack.com OR site:bsky.app', extract: "public posts in the last 180 days; themes, tone, what they amplify; scope per profile.socmint.scope; LinkedIn per S2-7"}
  - {id: F7,  name: affiliations,        weight: 0.6, socmint: false, depth: [standard, deep],       kinds: [person],                 query: '"{name}" board OR trustee OR advisory OR member OR association OR alumni', extract: "boards, associations, alumni networks, speaking circuits"}
  - {id: F8,  name: publications,        weight: 0.5, socmint: false, depth: [standard, deep],       kinds: [person, company],        query: '"{name}" author OR paper OR patent OR whitepaper OR book', extract: "what they have published; the positions they defend in print"}
  - {id: F9,  name: registers,           weight: 0.9, socmint: false, depth: [fast, standard, deep], kinds: [person, company, deal], query: by_domain, extract: "regulator / registry facts (see registers); C1 by definition"}
  - {id: F10, name: events,              weight: 0.5, socmint: false, depth: [standard, deep],       kinds: [person, company],        query: '"{name}" OR "{org}" conference OR summit OR webinar {year}', extract: "upcoming and recent appearances; a live hook for the opener"}
  - {id: F11, name: shared context,      weight: 0.8, socmint: false, depth: [standard, deep],       kinds: [person, company, deal], query: known_context only (no search), extract: "shared people, prior touches, mutual affiliations, the user's notes, files and answers -- all tagged Yours"}
  - {id: F12, name: counter-evidence,    weight: 0.7, socmint: false, depth: [standard, deep],       kinds: [person, company, deal], query: '"{org}" lawsuit OR layoffs OR departure OR decline OR criticism -- filtered by exclusions', extract: "what contradicts the strategic read; feeds the hypotheses; litigation stays excluded from the page"}
linkedin:   # S2-7, C16. AID-63 (Oct 15): LinkedIn as its public search results show it (osint), never a browser session; AID-62: a profile PDF the user saves stays optional until Daniel decides
  read: {search: read from search results, file: read from your file}
  not_read: not read   # spec Q9 ("not checked" or "not read"?) is open: 3.0.0's wording stays until Daniel decides
  reasons: [you declined, scope none, no matching profile]
  retired: {file not given: 2026-10-15}   # a brief run before this day keeps it (the 5 frozen targets, Oct 14, read LinkedIn only from a saved file); 'read in your browser', 'page blocked' and 'no browser here' are retired outright: no frozen run used them
osint:   # AID-63 (Oct 14 meeting, Oct 15): the record, LinkedIn included, by targeted web search in rounds. Rendered to references/osint-search.md
  rule: "The battery is mandatory (S2-9): every round whose source types the run's depth enables, in order, each with at least osint.battery.queries_per_round queries, most of them carrying an advanced operator or the tool's domain filter. Before each round, state one line, 'Round N (name): <query> | <query> | ...', the queries as they will be sent (coverage.rounds); then send them together, in one step, and no other search until the next round. From round 2 on, the queries carry the names, firms, programmes and topics the rounds before found: each round is refined from the last. A round is skipped only when the depth turns all its source types off, never for convenience; a round that finds nothing still counts, and its gap goes to Coverage."
  battery: {queries_per_round: {fast: 3, standard: 4, deep: 5}, operator_share: 0.7, since: 2026-10-15}   # since: briefs run earlier carry no counts in the Run row   # C21. Ben, Oct 14: "a battery of advanced search operators ... four or five rounds of Google dorks"
  operators: "Write each query as its round lists it, then send it the way the host's search takes it (osint.hosts). An operator here is site:, intitle:, inurl:, filetype:, after:, before:, OR, an exclusion (-) or the tool's domain filter; quotes alone are not one. When the results show an operator was ignored, log it on the round's line, rerun once with plain quoted terms, and filter the results yourself by their URLs, titles and dates. An ignored operator leaves a gap; it never shows that nothing exists."
  hosts:   # how each host's search takes the operators; Claude's checked live Oct 15, 2026
    - host: "Claude (Claude Code and the Claude apps): the WebSearch tool"
      checked: "Oct 15, 2026"
      rules:
        - "site: goes in allowed_domains (one call per domain set) and out of the query text: typed site: is ignored (site:linkedin.com/in returned Wikipedia and wage sites; allowed_domains [linkedin.com] returned the profile). Round 1's LinkedIn query is always the domain-filtered one."
        - "filetype:pdf stays in the query, and only results whose URL ends .pdf count for it: the tool ignores the operator (1 PDF in 10 results)."
        - "after: and before: become the month and year in the query ('October 2026'), and results dated outside the window are dropped: the tool ignores the operators."
        - "intitle: stays in the query, and results without the term in their title are dropped: it is honoured only in part. inurl: and quotes work as written (checked); OR and an exclusion (-) are sent as written."
        - "On a query without allowed_domains, blocked_domains takes the never-cited domains (source_quality.exclude)."
    - host: "ChatGPT, Grok, Perplexity, Gemini and other hosts"
      checked: "not tested"
      rules:
        - "Write each query as listed, operators included; where the search tool has a domain or recency setting, use it for site: and the date window."
        - "Apply the ignored-operator rule whenever the results show an operator was dropped."
  never: "Use only the result text the host's search tool returns for linkedin.com: never request a linkedin.com URL (profiles, posts or Pulse articles; an article republished elsewhere is opened there), never sign in anywhere, never open or drive a browser session (no computer use, no browser extension), and quote snippets minimally. The search provider's terms govern the query. Collect on the professional role only: the exclusions apply to every round, and a result that touches them by accident stays out of the brief."
  identity_lock: "A LinkedIn result is a lead, not an identity. Use it only when (a) its headline or current role names the person and gives the organisation as their current position (not past experience or a post), and one other detail agrees with the organisation as found elsewhere (its city or region, or its web domain); or (b) a second independent source (the organisation's own site, a filing, a news article) ties that profile or that exact role to the person. A generic title (Owner, President, Founder) counts only with the organisation. A detail that contradicts (another city, another firm) rejects it. A profile URL seen only as a link on another page, with no result of its own, is a lead for the domain-filtered search, not a second profile. When two or more profiles pass, or one falls short only for want of the second detail, search each one's exact address once outside LinkedIn, in the next round's batch ('\"linkedin.com/in/<slug>\" -site:linkedin.com'), and use only a profile that an independent page (the organisation's site, a filing, a news article; never LinkedIn or a people-search site) presents as the person's own account, by that exact address or a post under it. None or several so tied: use none. A page that calls a profile fake rejects it; posts under a profile's own address are not independent. Never pick by guess."
  # Oct 16, OST-C3 (adopted, option B): R12 saw two results reading 'Satya Nadella - Chairman and CEO at Microsoft' (/in/satyanadella, /in/satya-nadella-3145136) and used none; R13's CEO profile lacked the second detail. A tie is settled only by an independent page presenting the exact address as the person's own; slug shape and same-account posts never break it.
  example: "Intake 'Mark Brown, Precision Metal Fab'. The firm's own site says Odessa, TX; the only LinkedIn result reads 'Mark Brown - Owner - Precision Metal Fab | Greater Cleveland'. The location contradicts, so nothing from it is used: '**LinkedIn:** not read: no matching profile'."
  grading:
    - "Open the page behind a result before citing it and grade the page (C1 primary and dated, C2 reputable secondary); LinkedIn is the one source cited from its search result. A page that refuses the fetch (a bot wall, 401 or 403) keeps its fact at C3, logged 'not opened': a gap, not a finding that the fact is false. A page that is gone (404 or 410) is dead: cite another source or drop the fact (S2-8)."
    - "A LinkedIn result: tag LinkedIn, Measured for what the result shows (text across an ellipsis is not quoted as one), C3, the source written [linkedin.com, search result](the profile URL the result lists), the date 'seen <today>'. A fact resting on it alone says so in the sentence ('per their LinkedIn'); a role seen only there never prints as confirmed current."
    - "Items with one origin (a press release, a wire story, the person's own bio: shown by attribution, a link or near-identical wording) count as one source, graded by that origin; a speaker bio, a company bio and their LinkedIn are one self-reported source. Corroboration needs a second item with a different origin."
  rounds:
    - {round: 1, name: identity lock, types: [F1, F9], goal: "one person, one current role, one profile, or a stop", queries: ['site:linkedin.com/in "{name}" "{org}"', 'site:{org_domain} "{name}"', '"{name}" "{org}" {title}', '"{name}" {title} -"{org}" (namesakes: the same name at another firm or city)', '"{name}" "{org}" site:{a register for the domain, e.g. sec.gov, brokercheck.finra.org}'], next: "Two or more people could be the one you're meeting: stop and ask (S1-2). The organisation's own site and one other source tie the person to it: identity locked. Nothing ties them: continue on the organisation and say so in Coverage."}
    - {round: 2, name: role and history, types: [F2, F7], goal: "dated moves, boards, how they got here", queries: ['"{name}" (intitle:bio OR inurl:bio OR inurl:leadership OR inurl:speakers OR inurl:team)', '"{name}" appointed OR joined OR named OR promoted "{org}"', 'site:linkedin.com/in "{name}" "{a prior firm from round 1}"', '"{name}" board OR trustee OR advisory', '"{name}" "{a prior firm or school from round 1}"'], next: "Each prior firm and board found here becomes a term in rounds 3 and 4."}
    - {round: 3, name: last 90 days, types: [F3, F10], goal: "what changed for them and the organisation in the last 90 days", queries: ['"{name}" OR "{org}" announces OR appointed OR launches after:{date_90_days_ago}', 'site:{org_domain} inurl:news OR inurl:press "{name}"', '"{org}" results OR funding OR acquisition OR partnership after:{date_90_days_ago}', '"{name}" conference OR summit OR keynote {this year}', '"{org}" "{a programme, deal or firm from round 2}" after:{date_90_days_ago}'], next: "A dated event here is the opener's hook and B3's Recent wins line."}
    - {round: 4, name: their own words, types: [F5, F6, F8], goal: "quotes with a date and a link", queries: ['"{name}" interview OR podcast OR keynote OR panel', 'filetype:pdf "{name}" "{org}"', '"{name}" site:youtube.com OR site:linkedin.com/pulse OR site:linkedin.com/posts', '"{name}" "{a topic from rounds 2-3}"', 'intitle:"{name}" transcript OR remarks OR letter'], next: "Their recurring words feed In their words and the {profile}."}
    - {round: 5, name: gaps and counter-evidence, types: [F12, F11], goal: "only what is still Not determined, and what contradicts the read", queries: ['"{name}" OR "{org}" decides OR approves OR budget OR committee', '"{org}" layoffs OR departure OR decline OR criticism (the exclusions still apply)', '"{org}" "{a gap still Not determined: who decides, the gate, the timing}"', 'site:{org_domain} "{the gap term}" (the organisation in its own words on the open gap)', '"{org}" "{the claim the Take rests on}" -"{name}" (who disagrees with the read)'], next: "What is still open after this round becomes a Still open question in the room."}
source_quality:   # C18 (eval.py checks/cites). Weak: never C1/C2. Exclude: never cited. Prefer primary sources.
  weak: [mexc.com, medium.com, substack.com, quora.com, reddit.com, wikipedia.org, crunchbase.com, zoominfo.com, rocketreach.co, signalhire.com, contactout.com, theorg.com, famousbirthdays.com, celebsages.com, wealthygorilla.com, idcrawl.com]
  exclude: [goodfest.westfield.com, peoplefinders.com, spokeo.com, whitepages.com, beenverified.com, radaris.com, truthfinder.com, mylife.com]
registers:
  general:  []
  wealth:   [{name: FINRA BrokerCheck, url: "https://brokercheck.finra.org"}, {name: SEC IAPD, url: "https://adviserinfo.sec.gov"}, {name: SEC EDGAR, url: "https://www.sec.gov/edgar"}]
  pe:       [{name: SEC EDGAR Form D / ADV, url: "https://www.sec.gov/edgar"}, {name: Companies House (UK), url: "https://find-and-update.company-information.service.gov.uk"}]
  saas:     [{name: Companies House (UK), url: "https://find-and-update.company-information.service.gov.uk"}, {name: SEC EDGAR, url: "https://www.sec.gov/edgar"}]
research:
  full_threshold: {fast: 4, standard: 8, deep: 10}   # families with >= 1 C1/C2 claim
  socmint_networks:
    professional: [linkedin.com/posts, linkedin.com/pulse, youtube.com, podcasts]
    social:       [linkedin.com/posts, linkedin.com/pulse, youtube.com, podcasts, x.com, bsky.app, substack.com, medium.com]
    none:         []

exclusions:
  base: [health, family matters outside the public professional record, political giving, litigation as a talking point, home address, personal finances]
  by_jurisdiction:
    us:        []
    eu:        [any claim older than 5 years that is not a current role, retention of claims.jsonl after render]
    regulated: [performance claims, promissory language, comparative claims about named competitors]
    apac:      []
retention:
  default: keep claims.jsonl beside the PDF
  eu: delete claims.jsonl after render

# ------------------------------------------------------------------------------------------------
# 3. RUBRIC -- six dimensions (behavioral rubric shape), evidence tiers, and the ONLY
#    human-authored band phrases in the product. `shows` is the row label printed in B6.
# ------------------------------------------------------------------------------------------------
rubric:
  version: 2.0.0-public
  tiers:
    high:   {min_observations: 3, corroborated_across_sources: 2, requires_direct_quote_or_action: true}
    medium: {min_observations: 2, corroborated_across_sources: 1}
    low:    {min_observations: 1, inferred_from_role_only: true}
  dimensions:
    - id: dominance
      shows: Pace and control
      signals: [interrupts or redirects in recorded panels, directive language in posts, org-chart authority, first-person plural for the firm]
      meaning: {low: "Let them set the pace; ask before you propose.", mid: "Match their pace; propose once, then ask.", high: "Lead with the outcome in one sentence; they decide fast and dislike preamble."}
    - id: status_sensitivity
      shows: How they take recognition
      signals: [titles and awards foregrounded in bios, name-drops, curated public image, response to public recognition]
      meaning: {low: "Skip the flattery; substance only.", mid: "Acknowledge one specific achievement, then move on.", high: "Open with respect for a specific, recent, public achievement; never one-up."}
    - id: information_appetite
      shows: Appetite for detail
      signals: [length and density of their writing, data in their talks, questions they ask on panels, sources they cite]
      meaning: {low: "Headline and one proof point; offer detail only if asked.", mid: "Headline, two proof points, a source on request.", high: "Bring the numbers and the sources; allow silence after a question."}
    - id: risk_tolerance
      shows: Appetite for risk
      signals: [career moves into or out of stability, public positions on new or unproven things, language of caution vs. opportunity]
      meaning: {low: "Reduce risk first: references, reversibility, small first step.", mid: "Pair the upside with the safeguard in the same sentence.", high: "Lead with the upside and the speed; do not over-hedge."}
    - id: ego_vulnerability
      shows: How they take disagreement
      signals: [reaction to public criticism, defensiveness in interviews, credit-taking vs. credit-giving]
      meaning: {low: "Direct disagreement is fine; they separate idea from self.", mid: "Frame challenges as questions about the situation, not the person.", high: "Never correct them in the room; ask a question that lets them arrive at it."}
    - id: competitive_drive
      shows: How they keep score
      signals: [benchmarks and rankings in their language, peer references, win/loss framing]
      meaning: {low: "Frame around their own goals, not peers.", mid: "One peer reference is useful; more is noise.", high: "Name what peers are doing; they will want to be ahead of it."}
  ach:
    enabled_by_depth: [deep]
    max_hypotheses: 3
    requires_disconfirming_claim: true

# ------------------------------------------------------------------------------------------------
# 4. PAGE BUDGET -- ONE 3-page PDF: the brief on pages 1-2, the script on page 3. The renderer owns the
#    type sizes (format/talyx_pdf.py --style brief) and FAILS if its tightest rung still overflows.
# ------------------------------------------------------------------------------------------------
page_budget:
  total_pages: 3
  brief_pages: 2
  script_pages: 1
  columns: "B3|B4,B5|B6,B7|B8,P1+P2+P3+P4|P5+P6+P7+P8"   # side-by-side blocks, as in the approved schema (Oct 8)
brief:
  # The approved schema (proposed Oct 8; AID-7 still In Review, not locked): nine blocks and the evidence ledger. Ben's format.
  # Before B2: `# Full Name`, then the identity line, then the meta line (S4-5).
  sections:
    - {id: B1, title: Take, words: 60, prints: always, content: "One paragraph: **Take.** who they are and why this meeting matters to them now, in one sentence, every clause cited. **Evidence:** the one to three facts it rests on [n]. **Action:** the first move in the room, on the fact behind it [n]. **Avoid:** the one move that loses the meeting, on the fact that shows why [n] -- never a generic line. It adds no fact the blocks below don't cite."}
    - {id: B2, title: Questions that close gaps, words: 210, prints: always, content: "5 numbered questions, each <= 20 words, on the fact it rests on [n]; under each, one indented bullet: **Decides:** what the answer settles for you. **Ask:** whom -- the person, or who else is in the room. Ordered by what they decide; the mix follows the meeting type (Q4)."}
    - {id: B3, title: Who they are, words: 110, prints: always, content: "Bullets, label first: **Role:** title and since when [n] (required). **Path:** the prior roles that matter [n]. **The organization:** in its own words, plus one scale figure [n]. **What changed:** one to three dated items, newest first [n]. **Recent wins:** none to two dated, cited results [n]. Path, The organization and What changed read Not determined if not found; Recent wins is left out. From F1 F2 F3 F4 F9."}
    - {id: B4, title: In their words, words: 90, prints: always, content: "2-3 bullets, label first: **Topic, where, when:** \"their exact words\" [n]. None found: one line of themes from their public presence [n]; nothing at all: Not determined. Then always one last line, not a bullet: **LinkedIn:** read from search results, **LinkedIn:** read from your file, or **LinkedIn:** not read: and the reason (S2-7). From F5 F6 F8 and LinkedIn."}
    - {id: B5, title: Signals and what to do with them, words: 100, prints: always, content: "A table: | Observable | What to do with it |, three rows in this order: their priority and the gap, in their words [n] -> why this meeting matters to them; where your offer connects (Q8) [n] -> the bridge: the outcome you offer, not the method; the trigger, why now [n] -> the urgency, never invented. From F3 F10 F11 and Q8."}
    - {id: B6, title: "{profile}", words: 170, prints: always, content: "A table: | What the record shows | Your move |, six rows, one per rubric dimension, each starting with its label (Pace and control, How they take recognition, Appetite for detail, Appetite for risk, How they take disagreement, How they keep score) and a colon: the cited observation in at most 8 words [n] -> the rubric's move word for word. A dimension with no evidence is the bare label and No read (| Pace and control | No read |), never \"none found\". Then one line: **Evidence tier:** high, medium or low (it governs page 3). A cited observation and a move, never a verdict on their character."}
    - {id: B7, title: Who decides, words: 50, prints: always, content: "Bullets: **Decision maker:** who signs off [n]. **The gate:** what must be true, or who must agree, before a yes [n]. **Relationship holder:** who the relationship runs through [n]. Unknown: Not determined (a gap Still open may ask). From F1 F3 F9 F11."}
    - {id: B8, title: Strongest case against, words: 120, prints: always, content: "Up to 3 bullets: **Against:** the best evidence against your read [n]. **Reverses if:** what would flip it. None found: No counter-evidence found. Deep runs only, then `### What they may want from this meeting` and a table | Hypothesis and why it fits | Test: who answers, and what would disprove it |, up to 3 rows, each with the claim that would disprove it [n]. From F12; litigation stays off the page."}
    - {id: B9, title: Meeting angle, words: 120, prints: always, content: "One label per bullet (only The ask and its Fallback share one). `### This meeting` then bullets: **Frame:** what this meeting is, in their terms; not a pitch. **Lands:** [n]. **Repels:** [n]. **What to bring:** one thing of value [n]. **The ask:** specific and bounded, who and how long [n] · **Fallback:** the smaller ask. **Stop if:** the answer that means drop the ask. `### Meeting two` then **Meeting two:** the next conversation if this one lands, on a fact from this brief. **Meeting three:** where it goes after that. `### After the meeting` then **Capture:** what to record from the room that the public record couldn't give. From Q8 and B3-B8."}
    - {id: B10, title: Evidence ledger, words: 550, prints: always, content: "One line: {n} facts cited; status {FULL or LIMITED} at {n} of 12 source types. Each fact is measured unless its grade says otherwise. Dates are the sources' own; 'seen' marks the day an undated source was read. Then the table | # | What it says | Source | Grade | Date |, exactly one row per cited fact in order of first use (never grouped): [n] · the fact in about 8 words · [domain](url) (a file name for your own files) · Measured, Derived, Inference or Not determined · the source's own date, Mon D, YYYY, or Mon YYYY when the source gives only a month (claims.jsonl published); only for an undated source, the day it was read, marked 'seen Mon D, YYYY'. The tag (Direct, Search, LinkedIn, Yours) and confidence (C1-C4) stay in claims.jsonl, not on the page. Then a label grid (empty header row) with four rows: **Coverage** -- n of 12 source types, what was not found and why, and LinkedIn: read from search results, LinkedIn: read from your file, or LinkedIn: not read: and B4's reason. **Still open** -- at most 4 gaps, highest value first, each with the question that closes it in the room ('Label: question?', joined by ' · '). **Left out on purpose** -- the excluded topics, never the facts. **Run** -- date · depth · meeting type · prepared for · jurisdiction · status · decision-useful facts per page · N searches in M rounds (the battery as sent, S2-9)."}
  vocab_by_domain:
    general: []
    wealth:  [book, AUM, custodian, fee compression, succession, next-gen]
    pe:      [dry powder, DPI, add-on, hold period, exit]
    saas:    [ARR, NRR, champion, security review, procurement, renewal]
script:
  title: "{script}"
  subtitle: "Facts choose the moves; read the room, not the record"
  beats_by_format:
    intro:        [open, credibility in one line, one insight they did not have, ask for the second meeting]
    discovery:    [open, situation question, gap question, impact question, next-step test]
    close:        [open, restate their words, the outcome, the safeguard, the ask]
    relationship: [open, acknowledge what changed, one thing of value, one forward question]
  blocks:
    - {id: P1, title: Open, words: 80, prints: always, content: "Bullets: **Hook:** two sentences, said aloud, on a cited fact [n] -- in italics. **Credibility:** who you are, in one line, 30 seconds [n]. **Insight:** one thing they didn't have [n]. **Rule:** how to hold the opening's rapport through the questions."}
    - {id: P2, title: Question order, words: 120, prints: always, content: "Bullets: **Story:** **Process:** **Gate:** **History:** **Commitment:** -- B2's questions word for word, in the order the room needs, on the beats for the meeting type."}
    - {id: P3, title: "Objections: name it, then answer", words: 110, prints: always, content: "3 bullets: **Their likely objection:** *say it before they do, then the answer, at most 30 words* [n]."}
    - {id: P4, title: Close, words: 80, prints: always, content: "Bullets: **Restate:** ask what would make it an easy yes, then say it back in their words. **Real deadline:** a date that actually moves [n]. **The ask:** B9's ask · **Fallback:** B9's fallback. **Follow-up:** what you promise to send, and when."}
    - {id: P5, title: "Read the room (watch, do not assume)", words: 60, prints: "evidence tier medium or high", content: "Bullets: **Fast, wants the answer:** **Asks for terms and data:** **Talks about people:** **Big picture, ideas:** -- what you do, from B6."}
    - {id: P6, title: "Influence, one fact behind each", words: 80, prints: "evidence tier high and caller authority high; each principle only where a cited fact backs it", content: "Bullets, only for principles a cited fact backs: **Authority:** **Reciprocity:** **Commitment:** **Social proof:** **Liking:** **Scarcity:** (real limits only; never invented urgency) [n]."}
    - {id: P7, title: If it stalls, words: 60, prints: always, content: "2-3 bullets: **The move:** what restarts the conversation, from a fact in this brief [n]."}
    - {id: P8, title: Guardrails, words: 50, prints: always, content: "Bullets: **Rule:** what never to promise or claim, for the jurisdiction (Q7). **Never say:** the guardrails.never_say phrases and the domain's forbidden claims, quoted."}
    - {id: P9, title: Next step, words: 25, prints: always, content: "One line: **Next step:** the one action and its date."}
# ------------------------------------------------------------------------------------------------
# INVENTORY -- rendered to INVENTORY.md. Oct 9: "inventory of parts/components; what it produces ... if we can't
# produce it, parameterize it so it's conditional". Every part the user sees has one status: always, conditional
# (its Prints when, and the check that enforces it) or removed. No part is unknown. Blocks take their status from
# their own `prints:` above; `check:` names the check that enforces a conditional one.
# ------------------------------------------------------------------------------------------------
inventory:
  blocks:
    - {id: B1, produces: "the one-paragraph read: Take, Evidence, Action, Avoid", sources: [B2-B9]}
    - {id: B2, produces: "five questions, each on a cited fact, with what the answer decides and whom to ask", sources: [F1, F3, F5, F11, Q4]}
    - {id: B3, produces: "role, path, the organization, what changed and recent wins", sources: [F1, F2, F3, F4, F9]}
    - {id: B4, produces: "their own words, quoted and cited, and the LinkedIn status line", sources: [F5, F6, F8, LinkedIn]}
    - {id: B5, produces: "three signals -- their priority, where your offer connects, why now -- and what to do with each", sources: [F3, F10, F11, Q8]}
    - {id: B6, produces: "six observations and the move each one implies, and the evidence tier", sources: [F1, F5, F6, F7]}
    - {id: B7, produces: "decision maker, the gate and the relationship holder", sources: [F1, F3, F9, F11]}
    - {id: B8, produces: "the best evidence against the read and what would reverse it", sources: [F12]}
    - {id: B9, produces: "the frame, what lands and repels, what to bring, the ask and fallback, meetings two and three, what to capture", sources: [Q8, B3-B8]}
    - {id: B10, produces: "every cited fact with what it says, source, grade and date; then Coverage, Still open, Left out on purpose and Run", sources: [F1-F12, Q8]}
    - {id: P1, produces: "the hook said aloud, credibility, one insight, the rapport rule", sources: [B3, B4, Q8]}
    - {id: P2, produces: "B2's questions in the order the room needs", sources: [B2, Q4]}
    - {id: P3, produces: "the likely objections, named first, each with a short answer", sources: [B5, B8]}
    - {id: P4, produces: "restate, a real deadline, the ask and fallback, the follow-up", sources: [B9]}
    - {id: P5, produces: "what to do for each way they show up in the room", sources: [B6], check: C13}
    - {id: P6, produces: "influence principles, only where a cited fact backs one", sources: [B6, Q1], check: C13}
    - {id: P7, produces: "what restarts a stalled conversation, from a fact in the brief", sources: [B3-B9]}
    - {id: P8, produces: "what never to promise or say, for the jurisdiction and domain", sources: [Q2, Q7]}
    - {id: P9, produces: "the one next step and its date", sources: [B9]}
  parts:
    - {id: band, part: Classification band, produces: "the line above the name", sources: [names.classification], status: always}
    - {id: name, part: Name, produces: "the person's full name", sources: [S1], status: always}
    - {id: identity, part: Identity line, produces: "organization, role and since when, city if public", sources: [F1], status: always}
    - {id: meta, part: Meta line, produces: "meeting, prepared for, depth, sources, status, date", sources: [profile, S2], status: always}
    - {id: footer, part: Footer, produces: "the deliverable's name, the person, page N of 3", sources: [renderer], status: always, check: C10}
    - {id: B3.recent_wins, part: Recent wins line (B3), produces: "none to two dated, cited results", sources: [F3, F5], status: conditional, prints: "a dated, cited result was found; otherwise the line is left out", check: C13}
    - {id: B3.not_found, part: "Path, The organization, What changed (B3)", produces: "the fact, or Not determined (a gap Still open may ask)", sources: [F1, F2, F3, F4], status: always, check: C12}
    - {id: B4.linkedin, part: LinkedIn line (B4), produces: "read from search results, read from your file, or not read and the reason", sources: [S2-7], status: always, check: C16}
    - {id: B6.no_read, part: No read rows (B6), produces: "No read where a dimension lacks evidence (a gap Still open may ask)", sources: [S3-1], status: always, check: C12}
    - {id: B7.relationship_holder, part: Relationship holder (B7), produces: "who the relationship runs through, or Not determined (a gap Still open may ask)", sources: [F11, F1], status: always, check: C12}
    - {id: B8.hypotheses, part: What they may want (B8), produces: "up to three hypotheses, each with the claim that would disprove it", sources: [F12, S3-4], status: conditional, prints: "Depth deep", check: C13}
    - {id: B10.coverage, part: Coverage row (B10), produces: "n of 12 source types, what was not found, LinkedIn status", sources: [S2-4, S2-7], status: always, check: C16}
    - {id: B10.still_open, part: Still open row (B10), produces: "at most 4 questions for the room, highest value first", sources: [socratic.room], status: always, check: C12}
    - {id: B10.left_out, part: Left out on purpose row (B10), produces: "the excluded topics, never the facts", sources: [exclusions], status: always}
    - {id: B10.run, part: Run row (B10), produces: "date, depth, meeting type, prepared for, jurisdiction, status", sources: [profile], status: always}
    - {id: P.why, part: "Why lines (P1, P3, P4)", produces: "one line on why each move works", sources: [Q9], status: conditional, prints: "Q9 experience new", check: C15}
guardrails:
  never_say: ["Does that make sense?", "Is this helpful?", "No pressure", "You'd know better than me", "Just checking in"]
  forbidden_claims_by_domain:
    general: []
    wealth: [guaranteed, outperform, beat the market]
    pe: [guaranteed return, no downside]
    saas: [unlimited, zero risk]

# ------------------------------------------------------------------------------------------------
# 5. CHECKS -- every brief passes all before render. Each check names the command that runs it.
# ------------------------------------------------------------------------------------------------
checks:
  - {id: C1, name: swap,         cmd: "eval.py checks --swap",      passes_when: "no sentence in B1 or B3-B8 lacks both a [n] and a target-specific noun (headings, the tier line and Not determined lines aside)"}
  - {id: C2, name: bound,        cmd: "eval.py duf",                passes_when: "unbound == 0, dangling == 0, and every [n] in the body is a B10 row | [n] | what it says | source | grade | date | (tag and confidence stay in claims.jsonl)"}
  - {id: C3, name: quotes,       cmd: "eval.py checks --quotes",    passes_when: "every quoted string in B4 has a [n]"}
  - {id: C4, name: custom_q,     cmd: "eval.py checks --custom-q",  passes_when: ">= 2 questions in B2 carry a [n]"}
  - {id: C5, name: sections,     cmd: "eval.py checks --sections",  passes_when: "B1-B10 and P1-P9 present in order (P5 and P6 may be left out per S3-2)"}
  - {id: C6, name: budgets,      cmd: "eval.py checks --budgets",   passes_when: "no section exceeds its words by > 15%"}
  - {id: C7, name: never_say,    cmd: "eval.py checks --never-say", passes_when: "no never_say phrase appears outside P8"}
  - {id: C8, name: outcome,      cmd: "eval.py checks --outcome",   passes_when: "B5 contains no method verbs from checks.method_verbs"}
  - {id: C9, name: exclusions,   cmd: "eval.py checks --exclusions",passes_when: "no excluded topic keyword appears in the body"}
  - {id: C10, name: pages,       cmd: "format/talyx_pdf.py --style brief --brief-pages 2 --max-pages 3; eval.py pdf", passes_when: "exactly 3 pages: the brief on pages 1-2 with the evidence ledger last on page 2, the script on page 3, page 3 of 3 in the footer, a link for every ledger row not tagged Yours; page 3's numbered sections run 1, 2, 3 ... with no gap when a section drops"}
  - {id: C11, name: plain,       cmd: "eval.py checks --plain",     passes_when: "no plain_words.banned term or internal code outside quoted words"}
  - {id: C12, name: gaps,        cmd: "eval.py checks --gaps",      passes_when: "Still open holds at most 4 items, and at least one while B1-B9 show a gap (a Not determined **Label:** line or table cell, or a No read in B6); each item is 'Label: question?', the label a gap above, the question starting What, Who, How, When, Which, Where or If"}
  - {id: C13, name: conditional, cmd: "eval.py checks --conditional", passes_when: "B8's hypotheses only when the meta line says Depth deep; P6 only when B6 says Evidence tier: high; P5 not at tier low; B3's Recent wins line only with a dated, cited result (never Not determined or blank)"}
  - {id: C14, name: layout,      cmd: "eval.py checks --layout",    passes_when: "the brief has exactly the 9 blocks B1-B9 before B10, and B10 is its last block: no other block and nothing after the ledger; B9 has one label per line (The ask with its Fallback excepted); nothing prints '(not confirmed)', and the identity line prints nothing unknown"}
  - {id: C15, name: experience,  cmd: "eval.py checks --experience <Q9>", passes_when: "new: P1, P3 and P4 each have a **Why:** line of at most 12 words; experienced and top: no Why line; top: the Hook and each objection's answer are at most 15 words"}
  - {id: C16, name: linkedin,    cmd: "eval.py checks --linkedin",  passes_when: "B4 has exactly one **LinkedIn:** line: read from search results, read from your file, or not read: one of linkedin.reasons (a brief run before a linkedin.retired reason's day may give it); Coverage states the same; read from search results: a ledger row cites the linkedin.com/in profile the result showed; read from your file: no ledger row cites a linkedin.com/in profile (the file is cited); not read: no ledger row is tagged LinkedIn and Still open asks nothing about LinkedIn"}
  - {id: C17, name: cites,       cmd: "eval.py checks --cites (eval.py cites brief.md --fetch reads the pages too)", passes_when: "every cited sentence shares content with the ledger claim it cites (2+ content words, 1 when the claim is 3 words or fewer) and every [n] is a ledger row; a hypothetical (Reverses if, Stop if) carries no citation unless the row says it"}
  - {id: C18, name: quality,     cmd: "eval.py checks --quality",   passes_when: "no ledger row cites a source_quality.exclude domain; a source_quality.weak domain is never C1 or C2; fewer than 3 ledger rows carry the run's own date unmarked (those are read dates: give the source's date, or 'seen' when it has none)"}
  - {id: C19, name: render,      cmd: "eval.py pdf (also eval.py render OUT.pdf)", passes_when: "every page: no ink within 0.12in of a page edge, no word outside the 0.3in side margins; no page ends more than 0.5in above its footer margin; the schema's pairs (B3|B4, B5|B6, B7|B8) print side by side; page 1: the logo is whole in the top-right masthead; no block runs across a page break: page 2 opens on Who decides (B7, as in the schema) and no table prints its header row on two pages"}
  - {id: C20, name: colors,      cmd: "eval.py pdf (also eval.py render OUT.pdf)", passes_when: "every printed character is Midnight #0F2744, black #000000 or white #FFFFFF (no gray: the page must read when printed); the hairline #E8EAED is for rules only, never text"}
  - {id: C21, name: battery,     cmd: "eval.py checks --battery (the Run row); eval.py battery TRANSCRIPT --depth D [--brief brief.md or OUT.pdf] (the searches)", passes_when: "the Run row ends 'N searches in M rounds', at least the depth's floor (a brief run before osint.battery.since is exempt); in the run's transcript, a round is a 'Round N (name):' line (in the reply or the reasoning) and the searches after it, or, without such lines, one step's batch of searches; no search comes before round 1's line; the run runs every round the depth enables in order, at least the battery's queries per round and the share with an operator or a domain filter, sends round 1's LinkedIn query through the domain filter, requests no linkedin.com page and calls no browser tool, and its counts match the Run row"}
  - {method_verbs: ["we scrape", "we ingest", "our pipeline", "our model", "we crawl", "our algorithm"]}

# ------------------------------------------------------------------------------------------------
# 6. EVAL + RATCHET -- the instrument comes before the feature. duf_pp is the north star.
# ------------------------------------------------------------------------------------------------
eval:
  metric: duf_pp
  definition: "decision-useful fact = a ledger number [n] that is (a) cited in B1-B9 or P1-P9, (b) a B10 row with what it says, source, grade and date (tag and confidence in claims.jsonl), (c) target-specific (passes swap). duf_pp = count / pages."
  positive_control: evals/fixtures/control_12.md   # exactly 12 bound facts, 0 unbound -> counter must report 12/0
  negative_control: evals/fixtures/control_broken.md   # 3 unbound, 1 missing source -> counter must report unbound 3, dropped 1
  frozen_targets_dir: evals/targets
  ratchet_file: evals/ratchet.json
  policy: floor_is_best_ever_never_regress
  baseline_required_before_claims: true   # an improvement claim is reported as baseline -> current with both commands, never asserted
